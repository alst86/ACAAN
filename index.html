<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACAAN</title>
    <style>
        body {
            background-color: #0f111a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        h1 { color: #9d84ff; font-size: 2rem; margin-bottom: 10px; }
        #status { font-size: 1.2rem; margin-top: 20px; color: #a0a5b5; transition: color 0.1s; }
        #debug { font-size: 0.9rem; margin-top: 10px; color: #777; font-style: italic; min-height: 24px; padding: 0 20px; }
        #result { font-size: 1.4rem; margin-top: 30px; font-weight: bold; color: #ffffff; padding: 20px; border-radius: 10px; background: #232533; display: none; width: 80%; }
        #app-content { display: flex; flex-direction: column; align-items: center; width: 100%; }
        /* Hidden iOS 18+ Taptic Engine Switch */
        #haptic-wrap { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; overflow: hidden; }
    </style>
</head>
<body>

    <div id="haptic-wrap">
        <input type="checkbox" id="haptic-switch" switch>
        <label for="haptic-switch" id="haptic-label"></label>
    </div>

    <div id="app-content">
        <h1>ACAAN</h1>
        <div id="status">Initializing...</div>
        <div id="debug">Speak card and position</div>
        <div id="result"></div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const debugEl = document.getElementById('debug');
        const resultEl = document.getElementById('result');
        const hapticLabel = document.getElementById('haptic-label');

        let isSpeaking = false;
        let isAnalyzing = false;
        let isRecording = false;
        let hasAnnouncedReady = false;
        let speechFailSafeTimeout = null;
        let keepWarmInterval = null;
        
        let audioContext = null;
        let audioStream = null;
        let processorNode = null;
        let silenceTimer = null;
        let maxRecordTimer = null;

        let preRollChunks = [];
        let recordedChunks = [];
        const PRE_ROLL_MAX_CHUNKS = 6; 
        let utterancePeak = 0;

        // Two-way memory
        let pendingCard = null;
        let pendingPosition = null;
        let pendingTimer = null;

        // Pre-decoded AudioBuffers for 0ms pocket playback
        const alertBuffers = {
            ready: null,
            repeat: null,
            number: null,
            card: null
        };

        // --- HAPTIC & COVERT EAR-CON SYNTHESIZER ---
        function triggerHaptic(pattern = [60]) {
            try {
                if (navigator.vibrate) navigator.vibrate(pattern);
                if (hapticLabel) hapticLabel.click();
            } catch (e) {}
        }

        // Plays instant synthesized tones directly into the Bluetooth earpiece
        function playEarcon(type) {
            if (!audioContext || audioContext.state !== 'running') return;
            try {
                const now = audioContext.currentTime;
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);

                if (type === 'ready') {
                    // Crisp ascending double-chime (660Hz -> 880Hz)
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(660, now);
                    osc.frequency.setValueAtTime(880, now + 0.09);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
                    osc.start(now);
                    osc.stop(now + 0.23);
                } else if (type === 'listening') {
                    // Subtle 45ms high blip when mic re-opens
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(784, now);
                    gain.gain.setValueAtTime(0.09, now);
                    gain.gain.exponentialRampToValueAtTime(0.005, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.055);
                } else if (type === 'captured') {
                    // Soft 35ms low tick when recording cuts to Analyzing
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(420, now);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.005, now + 0.04);
                    osc.start(now);
                    osc.stop(now + 0.045);
                }
            } catch (e) {}
        }

        function unlockAudioContext() {
            triggerHaptic([40]);
            if (!audioContext) return;
            if (audioContext.state !== 'running') {
                audioContext.resume().then(() => {
                    announceReadyOnce();
                }).catch(() => {});
            } else {
                announceReadyOnce();
            }
        }
        document.body.addEventListener('touchstart', unlockAudioContext, { passive: true });
        document.body.addEventListener('touchend', unlockAudioContext, { passive: true });
        document.body.addEventListener('click', unlockAudioContext);

        async function decodeBase64ToBuffer(base64) {
            if (!base64 || !audioContext) return null;
            try {
                const binaryString = window.atob(base64);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                return await new Promise((resolve) => {
                    audioContext.decodeAudioData(bytes.buffer, resolve, () => resolve(null));
                });
            } catch (e) {
                return null;
            }
        }

        async function preloadAlerts() {
            try {
                const res = await fetch('/api/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'init_alerts' })
                });
                const data = await res.json();
                const [readyBuf, repeatBuf, numberBuf, cardBuf] = await Promise.all([
                    decodeBase64ToBuffer(data.ready),
                    decodeBase64ToBuffer(data.repeat),
                    decodeBase64ToBuffer(data.number),
                    decodeBase64ToBuffer(data.card)
                ]);
                alertBuffers.ready = readyBuf;
                alertBuffers.repeat = repeatBuf;
                alertBuffers.number = numberBuf;
                alertBuffers.card = cardBuf;

                if (!hasAnnouncedReady && audioContext && audioContext.state === 'running') {
                    announceReadyOnce();
                }
            } catch (e) {}
        }

        function announceReadyOnce() {
            if (hasAnnouncedReady || !audioContext || audioContext.state !== 'running') return;
            hasAnnouncedReady = true;
            triggerHaptic([70, 50, 70]);
            playEarcon('ready');
            if (alertBuffers.ready) {
                setTimeout(() => playDecodedBuffer(alertBuffers.ready, false), 180);
            }
        }

        async function startListening() {
            if (audioStream) return; 

            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const sourceNode = audioContext.createMediaStreamSource(audioStream);

                // 1024 frame size (~23ms resolution) for ultra-fast speech cutoff
                processorNode = audioContext.createScriptProcessor(1024, 1, 1);
                const silentGain = audioContext.createGain();
                silentGain.gain.value = 0;

                sourceNode.connect(processorNode);
                processorNode.connect(silentGain);
                silentGain.connect(audioContext.destination);

                processorNode.onaudioprocess = (e) => {
                    if (isSpeaking || isAnalyzing) return;

                    const inputData = e.inputBuffer.getChannelData(0);
                    const chunkCopy = new Float32Array(inputData);

                    let maxPeak = 0;
                    for (let i = 0; i < chunkCopy.length; i++) {
                        const abs = Math.abs(chunkCopy[i]);
                        if (abs > maxPeak) maxPeak = abs;
                    }
                    const displayLevel = Math.min(99, Math.round(maxPeak * 140));
                    const START_THRESHOLD = 9;

                    if (!isRecording) {
                        preRollChunks.push(chunkCopy);
                        if (preRollChunks.length > PRE_ROLL_MAX_CHUNKS) {
                            preRollChunks.shift();
                        }
                        statusEl.innerText = `Listening... (${displayLevel})`;
                        statusEl.style.color = "#a0a5b5";

                        if (displayLevel > START_THRESHOLD) {
                            isRecording = true;
                            utterancePeak = displayLevel;
                            recordedChunks = [...preRollChunks, chunkCopy];
                            preRollChunks = [];
                            statusEl.innerText = "Recording...";
                            statusEl.style.color = "#ff5555";

                            if (pendingTimer) clearTimeout(pendingTimer);

                            maxRecordTimer = setTimeout(() => {
                                if (isRecording) finishRecordingAndTranscribe();
                            }, 3200);

                            clearTimeout(silenceTimer);
                            silenceTimer = setTimeout(() => {
                                if (isRecording) finishRecordingAndTranscribe();
                            }, 460);
                        }
                    } else {
                        recordedChunks.push(chunkCopy);
                        if (displayLevel > utterancePeak) {
                            utterancePeak = displayLevel;
                        }

                        // Dynamic threshold: ignores room noise so silence timer doesn't hang
                        const dynamicContinueThreshold = Math.max(9, Math.min(18, Math.round(utterancePeak * 0.35)));

                        if (displayLevel > dynamicContinueThreshold) {
                            clearTimeout(silenceTimer);
                            silenceTimer = setTimeout(() => {
                                if (isRecording) finishRecordingAndTranscribe();
                            }, 460);
                        }
                    }
                };

                resetToListening(false);
                announceReadyOnce();
                preloadAlerts();

                // Keep Vercel serverless container warm while in pocket
                clearInterval(keepWarmInterval);
                keepWarmInterval = setInterval(() => {
                    if (!isAnalyzing && !isRecording) {
                        fetch('/api/transcribe', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'ping' })
                        }).catch(() => {});
                    }
                }, 25000);

            } catch (err) {
                statusEl.innerText = "Mic Permission Denied";
            }
        }

        function encodeWAV(chunks, inputSampleRate) {
            // Trim silent head & tail chunks so Whisper processes at maximum speed
            let startIdx = 0;
            while (startIdx < chunks.length - 4) {
                const c = chunks[startIdx];
                let peak = 0;
                for (let i = 0; i < c.length; i++) {
                    const a = Math.abs(c[i]);
                    if (a > peak) peak = a;
                }
                if (peak * 140 < 6) startIdx++;
                else break;
            }
            startIdx = Math.max(0, startIdx - 2);

            let endIdx = chunks.length;
            while (endIdx > startIdx + 4) {
                const c = chunks[endIdx - 1];
                let peak = 0;
                for (let i = 0; i < c.length; i++) {
                    const a = Math.abs(c[i]);
                    if (a > peak) peak = a;
                }
                if (peak * 140 < 7) endIdx--;
                else break;
            }
            const trimmedChunks = chunks.slice(startIdx, endIdx);

            let totalLength = 0;
            for (const c of trimmedChunks) totalLength += c.length;
            const merged = new Float32Array(totalLength);
            let offset = 0;
            for (const c of trimmedChunks) {
                merged.set(c, offset);
                offset += c.length;
            }

            const targetRate = 8000;
            const ratio = inputSampleRate / targetRate;
            const newLength = Math.round(merged.length / ratio);
            const buffer = new ArrayBuffer(44 + newLength * 2);
            const view = new DataView(buffer);

            const writeString = (off, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i));
            };

            writeString(0, 'RIFF');
            view.setUint32(4, 36 + newLength * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, targetRate, true);
            view.setUint32(28, targetRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, newLength * 2, true);

            let outOffset = 44;
            for (let i = 0; i < newLength; i++) {
                const sampleIndex = Math.min(merged.length - 1, Math.floor(i * ratio));
                const s = Math.max(-1, Math.min(1, merged[sampleIndex]));
                view.setInt16(outOffset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                outOffset += 2;
            }

            const bytes = new Uint8Array(buffer);
            let binary = '';
            const chunkSize = 8192;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return window.btoa(binary);
        }

        async function finishRecordingAndTranscribe() {
            clearTimeout(silenceTimer);
            clearTimeout(maxRecordTimer);
            isRecording = false;

            const chunksToProcess = recordedChunks;
            recordedChunks = [];

            if (chunksToProcess.length === 0) {
                resetToListening(false);
                return;
            }

            isAnalyzing = true;
            statusEl.innerText = "Analyzing...";
            statusEl.style.color = "#ffb86c";

            // Instant pocket audio cue that speech capture finished and analysis started
            playEarcon('captured');

            try {
                const sampleRate = audioContext ? audioContext.sampleRate : 44100;
                const base64Wav = encodeWAV(chunksToProcess, sampleRate);

                const res = await fetch('/api/transcribe', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        audio: base64Wav,
                        pendingCard: pendingCard,
                        pendingPosition: pendingPosition
                    })
                });
                const data = await res.json();
                isAnalyzing = false;

                if (data.error) {
                    debugEl.innerText = `Error: ${data.error}`;
                    resetToListening(true);
                    return;
                }

                if (data.resolved) {
                    clearTimeout(pendingTimer);
                    pendingCard = null;
                    pendingPosition = null;

                    debugEl.innerText = data.debugText;
                    resultEl.innerText = data.resultText;
                    resultEl.style.display = 'block';
                    triggerHaptic([80, 40, 80]);

                    if (data.audio) {
                        playBase64Audio(data.audio);
                    } else {
                        resetToListening(true);
                    }
                    return;
                }

                handleUnresolvedSpeech(data);
            } catch (e) {
                isAnalyzing = false;
                debugEl.innerText = "Connection error.";
                resetToListening(true);
            }
        }

        function startPendingTimeout() {
            clearTimeout(pendingTimer);
            pendingTimer = setTimeout(() => {
                if (pendingCard || pendingPosition) {
                    pendingCard = null;
                    pendingPosition = null;
                    debugEl.innerText = "Timed out waiting for second part.";
                    playAlert('repeat');
                }
            }, 12000);
        }

        function playAlert(type) {
            triggerHaptic([50]);
            const buffer = alertBuffers[type];
            if (buffer) {
                playDecodedBuffer(buffer, true);
            } else {
                const fallbackMap = { repeat: "Repeat.", number: "Number.", card: "Card.", ready: "Ready." };
                speakFallback(fallbackMap[type] || "Repeat.");
            }
        }

        function handleUnresolvedSpeech(data) {
            const rawText = data.text || "";

            if (data.card && !data.position) {
                pendingCard = data.card;
                const formatted = data.card.replace(/\b\w/g, c => c.toUpperCase());
                debugEl.innerText = `Locked: ${formatted} — Say position...`;
                startPendingTimeout();
                playAlert('number');
                return;
            }

            if (!data.card && data.position) {
                pendingPosition = data.position;
                debugEl.innerText = `Locked Position: ${data.position} — Say card...`;
                startPendingTimeout();
                playAlert('card');
                return;
            }

            if (data.partialCardAttempt) {
                debugEl.innerText = `Missed card value: "${rawText}"`;
                playAlert('repeat');
                return;
            }

            if (pendingCard) {
                debugEl.innerText = `Locked: ${pendingCard.toUpperCase()} — Waiting for number...`;
            } else if (pendingPosition) {
                debugEl.innerText = `Locked Position: ${pendingPosition} — Waiting for card...`;
            } else {
                debugEl.innerText = `Ignored chatter: "${rawText}"`;
            }
            resetToListening(false);
        }

        function playDecodedBuffer(decodedBuffer, playReadyBlipAfter = true) {
            if (!audioContext || !decodedBuffer) {
                resetToListening(playReadyBlipAfter);
                return;
            }
            isSpeaking = true;
            statusEl.innerText = "Speaking...";
            statusEl.style.color = "#9d84ff";

            speechFailSafeTimeout = setTimeout(() => {
                resetToListening(playReadyBlipAfter);
            }, 5000);

            try {
                const bufferSource = audioContext.createBufferSource();
                bufferSource.buffer = decodedBuffer;
                bufferSource.connect(audioContext.destination);
                bufferSource.onended = () => {
                    setTimeout(() => resetToListening(playReadyBlipAfter), 140);
                };
                bufferSource.start(0);
            } catch (e) {
                resetToListening(playReadyBlipAfter);
            }
        }

        async function playBase64Audio(base64Audio) {
            isSpeaking = true;
            statusEl.innerText = "Speaking...";
            statusEl.style.color = "#9d84ff";

            speechFailSafeTimeout = setTimeout(() => {
                resetToListening(true);
            }, 6000);

            try {
                if (audioContext && audioContext.state !== 'running') {
                    await audioContext.resume().catch(() => {});
                }
                const decodedBuffer = await decodeBase64ToBuffer(base64Audio);
                if (decodedBuffer) {
                    playDecodedBuffer(decodedBuffer, true);
                } else {
                    resetToListening(true);
                }
            } catch (e) {
                resetToListening(true);
            }
        }

        async function speakFallback(text) {
            try {
                const res = await fetch('/api/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'tts', text: text })
                });
                const data = await res.json();
                if (data.audio) playBase64Audio(data.audio);
                else resetToListening(true);
            } catch (e) {
                resetToListening(true);
            }
        }

        function resetToListening(emitBlip = false) {
            isSpeaking = false;
            isAnalyzing = false;
            clearTimeout(speechFailSafeTimeout);
            if (audioContext && audioContext.state !== 'running') {
                audioContext.resume().catch(() => {});
            }
            statusEl.innerText = "Listening...";
            statusEl.style.color = "#a0a5b5";
            if (emitBlip) {
                playEarcon('listening');
            }
        }

        function stopListening() {
            clearTimeout(silenceTimer);
            clearTimeout(maxRecordTimer);
            clearTimeout(speechFailSafeTimeout);
            clearTimeout(pendingTimer);
            clearInterval(keepWarmInterval);
            if (processorNode) {
                try { processorNode.disconnect(); } catch (e) {}
                processorNode = null;
            }
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
                audioStream = null;
            }
            if (audioContext) {
                audioContext.close().catch(() => {});
                audioContext = null;
            }
            isRecording = false;
            isSpeaking = false;
            isAnalyzing = false;
            hasAnnouncedReady = false;
            statusEl.innerText = "Paused";
        }

        window.addEventListener('load', startListening);

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopListening();
            } else {
                startListening();
            }
        });
    </script>
</body>
</html>
