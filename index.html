<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ACAAN</title>
    <style>
        body {
            background-color: #0f111a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }
        h1 { color: #9d84ff; font-size: 2rem; margin-bottom: 10px; }
        #status { font-size: 1.2rem; margin-top: 20px; color: #a0a5b5; }
        #debug { font-size: 0.9rem; margin-top: 10px; color: #555; font-style: italic; min-height: 20px; padding: 0 20px; }
        #result { font-size: 1.5rem; margin-top: 30px; font-weight: bold; color: #ffffff; padding: 20px; border-radius: 10px; background: #232533; display: none; width: 80%; }
    </style>
</head>
<body>

    <h1>ACAAN</h1>
    <div id="status">Starting mic...</div>
    <div id="debug">Tap screen once to unlock voice</div>
    <div id="result"></div>

    <script>
        const stack = [
            "4 of clubs", "2 of hearts", "7 of diamonds", "3 of clubs", "4 of hearts", "6 of diamonds", "ace of spades", "5 of hearts", "9 of spades", "2 of spades",
            "queen of hearts", "3 of diamonds", "queen of clubs", "8 of hearts", "6 of spades", "5 of spades", "9 of hearts", "king of clubs", "2 of diamonds", "jack of hearts",
            "3 of spades", "8 of spades", "6 of hearts", "10 of clubs", "5 of diamonds", "king of diamonds", "2 of clubs", "3 of hearts", "8 of diamonds", "5 of clubs",
            "king of spades", "jack of diamonds", "8 of clubs", "10 of spades", "king of hearts", "jack of clubs", "7 of spades", "10 of hearts", "ace of diamonds", "4 of spades",
            "7 of hearts", "4 of diamonds", "ace of clubs", "9 of clubs", "jack of spades", "queen of diamonds", "7 of clubs", "queen of spades", "10 of diamonds", "6 of clubs",
            "ace of hearts", "9 of diamonds"
        ];

        const statusEl = document.getElementById('status');
        const debugEl = document.getElementById('debug');
        const resultEl = document.getElementById('result');

        let recognition;
        let isListening = false;
        let voiceUnlocked = false;
        let isSpeaking = false; 
        let isAppActive = true;
        
        window.currentUtterance = null;
        let speechFailSafeTimeout = null;
        let selectedVoice = null;
        
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-SG'; // Set specifically to English (Singapore)

            recognition.onstart = () => {
                isListening = true;
                if (isAppActive) statusEl.innerText = "Listening...";
            };

            recognition.onresult = (event) => {
                let transcript = event.results[event.results.length - 1][0].transcript.toLowerCase();
                transcript = transcript.replace(/[.,!?]/g, "").trim();
                
                debugEl.innerText = `Heard: "${transcript}"`;
                
                processInput(transcript);
            };

            recognition.onerror = (event) => {
                if(event.error !== 'no-speech' && !isSpeaking && isAppActive) {
                    statusEl.innerText = "Error, restarting mic...";
                }
            };

            recognition.onend = () => {
                isListening = false;
                if (!isSpeaking && isAppActive) {
                    setTimeout(() => {
                        try { recognition.start(); } catch(e) {}
                    }, 400);
                }
            };
        } else {
            statusEl.innerText = "Speech recognition not supported in this browser.";
        }

        // --- App Lifecycle Management (Turn mic off when closed/backgrounded) ---
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                isAppActive = false;
                if (recognition) recognition.abort(); // Kill mic immediately
            } else {
                isAppActive = true;
                if (recognition && !isListening && !isSpeaking) {
                    setTimeout(() => {
                        try { recognition.start(); } catch(e) {}
                    }, 400);
                }
            }
        });

        window.addEventListener('pagehide', () => {
            if (recognition) recognition.abort();
        });
        // ------------------------------------------------------------------------

        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            if (voices.length > 0) {
                selectedVoice = voices.find(voice => voice.lang.includes('en')) || voices[0];
            }
        }
        
        window.speechSynthesis.onvoiceschanged = loadVoices;

        document.body.addEventListener('touchstart', () => {
            if (!voiceUnlocked) {
                loadVoices();
                window.speechSynthesis.resume();
                
                const unlockUtterance = new SpeechSynthesisUtterance(' ');
                unlockUtterance.volume = 0.01; 
                if (selectedVoice) unlockUtterance.voice = selectedVoice;
                window.speechSynthesis.speak(unlockUtterance);
                
                voiceUnlocked = true;
                debugEl.innerText = "(Voice Unlocked) Listening...";
            }
        });

        window.addEventListener('load', () => {
            loadVoices();
            if (recognition && !isListening && isAppActive) {
                try { recognition.start(); } catch(e) {}
            }
        });

        function getEditDistance(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            const matrix = Array.from({ length: a.length + 1 }, (_, i) => [i]);
            for (let j = 0; j <= b.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    if (a[i - 1] === b[j - 1]) matrix[i][j] = matrix[i - 1][j - 1];
                    else matrix[i][j] = Math.min(matrix[i - 1][j - 1], matrix[i][j - 1], matrix[i - 1][j]) + 1;
                }
            }
            return matrix[a.length][b.length];
        }

        function findBestCardMatch(text) {
            let bestMatch = null;
            let bestScore = Infinity;
            let bestIndex = -1;

            const words = text.split(" ");
            
            for (let i = 0; i < stack.length; i++) {
                const card = stack[i];
                const cardWordCount = card.split(" ").length;
                
                if (words.length <= cardWordCount) {
                    const distance = getEditDistance(text, card);
                    if (distance < bestScore) {
                        bestScore = distance;
                        bestMatch = card;
                        bestIndex = i;
                    }
                    continue;
                }

                for (let j = 0; j <= words.length - cardWordCount; j++) {
                    const snippet = words.slice(j, j + cardWordCount).join(" ");
                    const distance = getEditDistance(snippet, card);
                    
                    if (distance < bestScore) {
                        bestScore = distance;
                        bestMatch = card;
                        bestIndex = i;
                    }
                }
            }

            return bestScore <= 5 ? { card: bestMatch, index: bestIndex } : null;
        }

        function processInput(text) {
            if (isSpeaking) return;

            text = text.replace(/\bone\b/g, "1").replace(/\btwo\b/g, "2").replace(/\bthree\b/g, "3")
                       .replace(/\bfour\b/g, "4").replace(/\bfive\b/g, "5").replace(/\bsix\b/g, "6")
                       .replace(/\bseven\b/g, "7").replace(/\beight\b/g, "8").replace(/\bnine\b/g, "9")
                       .replace(/\bten\b/g, "10");

            const matchResult = findBestCardMatch(text);
            const numberMatch = text.match(/\b([1-9]|[1-4][0-9]|5[0-2])\b/);
            
            if (matchResult && numberMatch) {
                const targetPosition = parseInt(numberMatch[1], 10);
                const currentPosition = matchResult.index + 1; 

                let cutAmount = currentPosition - targetPosition;
                if (cutAmount < 0) {
                    cutAmount += 52;
                }

                if (cutAmount === 0) return; 

                const bottomCardIndex = (cutAmount - 1 + 52) % 52;
                const bottomCard = stack[bottomCardIndex];

                const formattedCard = bottomCard.replace(/\b\w/g, c => c.toUpperCase());
                const outputText = `Cut ${cutAmount} cards (${formattedCard}).`;

                resultEl.innerText = outputText;
                resultEl.style.display = 'block';

                speak(outputText);
            }
        }

        function finishSpeakingAndRestartMic() {
            if (!isSpeaking) return;
            isSpeaking = false;
            clearTimeout(speechFailSafeTimeout);
            
            if (isAppActive) {
                statusEl.innerText = "Listening...";
                setTimeout(() => {
                    try { recognition.start(); } catch(e) {}
                }, 400);
            }
        }

        function speak(text) {
            isSpeaking = true;
            statusEl.innerText = "Speaking...";
            
            if (recognition) {
                recognition.abort(); 
            }

            window.speechSynthesis.cancel();

            setTimeout(() => {
                window.currentUtterance = new SpeechSynthesisUtterance(text);
                window.currentUtterance.rate = 1.0;
                window.currentUtterance.volume = 1.0;
                
                if (selectedVoice) {
                    window.currentUtterance.voice = selectedVoice;
                }

                window.currentUtterance.onend = () => {
                    finishSpeakingAndRestartMic();
                };

                window.currentUtterance.onerror = (e) => {
                    finishSpeakingAndRestartMic();
                };

                window.speechSynthesis.speak(window.currentUtterance);

                speechFailSafeTimeout = setTimeout(() => {
                    finishSpeakingAndRestartMic();
                }, 4000);
                
            }, 400); 
        }
    </script>
</body>
</html>
