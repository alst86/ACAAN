<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACAAN</title>
    <style>
        body {
            background-color: #0f111a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        h1 { color: #9d84ff; font-size: 2rem; margin-bottom: 10px; }
        #status { font-size: 1.2rem; margin-top: 20px; color: #a0a5b5; transition: color 0.3s; }
        #debug { font-size: 0.9rem; margin-top: 10px; color: #555; font-style: italic; min-height: 20px; padding: 0 20px; }
        #result { font-size: 1.5rem; margin-top: 30px; font-weight: bold; color: #ffffff; padding: 20px; border-radius: 10px; background: #232533; display: none; width: 80%; }
        #app-content { display: flex; flex-direction: column; align-items: center; width: 100%; }
    </style>
</head>
<body>

    <div id="app-content">
        <h1>ACAAN</h1>
        <div id="status">Initializing...</div>
        <div id="debug">Tap screen once to unlock earpiece audio</div>
        <div id="result"></div>
    </div>

    <!-- Standard HTML5 Audio Player for Bluetooth Earpiece Routing -->
    <audio id="audioPlayer" playsinline></audio>

    <script>
        const stack = [
            "4 of clubs", "2 of hearts", "7 of diamonds", "3 of clubs", "4 of hearts", "6 of diamonds", "ace of spades", "5 of hearts", "9 of spades", "2 of spades",
            "queen of hearts", "3 of diamonds", "queen of clubs", "8 of hearts", "6 of spades", "5 of spades", "9 of hearts", "king of clubs", "2 of diamonds", "jack of hearts",
            "3 of spades", "8 of spades", "6 of hearts", "10 of clubs", "5 of diamonds", "king of diamonds", "2 of clubs", "3 of hearts", "8 of diamonds", "5 of clubs",
            "king of spades", "jack of diamonds", "8 of clubs", "10 of spades", "king of hearts", "jack of clubs", "7 of spades", "10 of hearts", "ace of diamonds", "4 of spades",
            "7 of hearts", "4 of diamonds", "ace of clubs", "9 of clubs", "jack of spades", "queen of diamonds", "7 of clubs", "queen of spades", "10 of diamonds", "6 of clubs",
            "ace of hearts", "9 of diamonds"
        ];

        const statusEl = document.getElementById('status');
        const debugEl = document.getElementById('debug');
        const resultEl = document.getElementById('result');
        const audioPlayer = document.getElementById('audioPlayer');

        let isSpeaking = false;
        let voiceUnlocked = false;
        let speechFailSafeTimeout = null;
        
        let audioContext = null;
        let mediaRecorder = null;
        let audioStream = null;
        let audioChunks = [];
        let isRecording = false;
        let silenceTimer = null;
        let analyser = null;
        let dataArray = null;
        let animationFrameId = null;

        // Unlock HTML5 Audio Player on first screen touch
        document.body.addEventListener('touchstart', () => {
            if (!voiceUnlocked) {
                audioPlayer.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
                audioPlayer.play().catch(() => {});
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                voiceUnlocked = true;
                debugEl.innerText = "(Audio Unlocked) Ready";
            }
        });

        async function startListening() {
            if (audioStream) return; 

            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(audioStream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                mediaRecorder = new MediaRecorder(audioStream);
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                
                mediaRecorder.onstop = async () => {
                    if (audioChunks.length === 0) return;
                    const audioBlob = new Blob(audioChunks, { type: 'audio/mp4' });
                    audioChunks = []; 
                    
                    statusEl.innerText = "Analyzing...";
                    statusEl.style.color = "#ffb86c"; 
                    
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = async () => {
                        const base64data = reader.result.split(',')[1];
                        
                        try {
                            const res = await fetch('/api/transcribe', { 
                                method: 'POST', 
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ audio: base64data })
                            });
                            const data = await res.json();
                            
                            if (data.error) {
                                debugEl.innerText = `API Error: ${data.error}`;
                                resetToListening();
                                return;
                            }
                            
                            if (data.text) {
                                debugEl.innerText = `AI Heard: "${data.text}"`;
                                processInput(data.text);
                            } else {
                                resetToListening();
                            }
                        } catch (e) {
                            debugEl.innerText = "Error reaching AI Server.";
                            resetToListening();
                        }
                    };
                };

                resetToListening();
                monitorAudioLevel();

            } catch (err) {
                statusEl.innerText = "Mic Permission Denied.";
            }
        }

        function resetToListening() {
            isSpeaking = false;
            clearTimeout(speechFailSafeTimeout);
            if (audioStream) {
                audioStream.getAudioTracks().forEach(t => t.enabled = true);
            }
            statusEl.innerText = "Listening...";
            statusEl.style.color = "#a0a5b5";
        }

        function stopListening() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
                audioStream = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            clearTimeout(silenceTimer);
            clearTimeout(speechFailSafeTimeout);
            isRecording = false;
            isSpeaking = false;
            statusEl.innerText = "Paused...";
        }

        window.addEventListener('load', startListening);

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopListening();
            } else {
                startListening();
            }
        });

        function monitorAudioLevel() {
            if (!analyser || !audioStream) return;
            if (isSpeaking) {
                animationFrameId = requestAnimationFrame(monitorAudioLevel);
                return;
            }

            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for(let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            let average = sum / dataArray.length;

            const SPEECH_THRESHOLD = 15; 

            if (average > SPEECH_THRESHOLD) {
                if (!isRecording && mediaRecorder && mediaRecorder.state === 'inactive') {
                    isRecording = true;
                    mediaRecorder.start();
                    statusEl.innerText = "Recording...";
                    statusEl.style.color = "#ff5555"; 
                }
                
                clearTimeout(silenceTimer);
                
                silenceTimer = setTimeout(() => {
                    if (isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') {
                        isRecording = false;
                        mediaRecorder.stop(); 
                    }
                }, 1200); 
            }
            
            animationFrameId = requestAnimationFrame(monitorAudioLevel);
        }

        function getEditDistance(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            const matrix = Array.from({ length: a.length + 1 }, (_, i) => [i]);
            for (let j = 0; j <= b.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    if (a[i - 1] === b[j - 1]) matrix[i][j] = matrix[i - 1][j - 1];
                    else matrix[i][j] = Math.min(matrix[i - 1][j - 1], matrix[i][j - 1], matrix[i - 1][j]) + 1;
                }
            }
            return matrix[a.length][b.length];
        }

        function findBestCardMatch(text) {
            let bestMatch = null;
            let bestScore = Infinity;
            let bestIndex = -1;
            const words = text.split(" ");
            
            for (let i = 0; i < stack.length; i++) {
                const card = stack[i];
                const cardWordCount = card.split(" ").length;
                
                if (words.length <= cardWordCount) {
                    const distance = getEditDistance(text, card);
                    if (distance < bestScore) {
                        bestScore = distance;
                        bestMatch = card;
                        bestIndex = i;
                    }
                    continue;
                }

                for (let j = 0; j <= words.length - cardWordCount; j++) {
                    const snippet = words.slice(j, j + cardWordCount).join(" ");
                    const distance = getEditDistance(snippet, card);
                    if (distance < bestScore) {
                        bestScore = distance;
                        bestMatch = card;
                        bestIndex = i;
                    }
                }
            }
            return bestScore <= 7 ? { card: bestMatch, index: bestIndex } : null;
        }

        function processInput(text) {
            let processedText = text.toLowerCase()
                                    .replace(/[.,!?]/g, '')
                                    .replace(/\b(at|to|number|position|cut|for|the)\b/g, '')
                                    .replace(/\bone\b/g, "1").replace(/\btwo\b/g, "2").replace(/\bthree\b/g, "3")
                                    .replace(/\bfour\b/g, "4").replace(/\bfive\b/g, "5").replace(/\bsix\b/g, "6")
                                    .replace(/\bseven\b/g, "7").replace(/\beight\b/g, "8").replace(/\bnine\b/g, "9")
                                    .replace(/\bten\b/g, "10")
                                    .replace(/\s+/g, " ").trim();

            const numbers = processedText.match(/\b([1-9]|[1-4][0-9]|5[0-2])\b/g);
            
            if (numbers && numbers.length > 0) {
                const targetPositionStr = numbers[numbers.length - 1];
                const targetPosition = parseInt(targetPositionStr, 10);
                
                const lastIndex = processedText.lastIndexOf(targetPositionStr);
                let textWithoutPosition = processedText;
                if (lastIndex !== -1) {
                    textWithoutPosition = processedText.substring(0, lastIndex) + processedText.substring(lastIndex + targetPositionStr.length);
                }

                const matchResult = findBestCardMatch(textWithoutPosition.trim());
                
                if (matchResult) {
                    const currentPosition = matchResult.index + 1; 

                    let cutAmount = currentPosition - targetPosition;
                    if (cutAmount < 0) cutAmount += 52;
                    if (cutAmount === 0) {
                        resetToListening();
                        return; 
                    }

                    const bottomCardIndex = (cutAmount - 1 + 52) % 52;
                    const bottomCard = stack[bottomCardIndex];
                    const formattedCard = bottomCard.replace(/\b\w/g, c => c.toUpperCase());
                    const outputText = `Cut ${cutAmount} cards, ${formattedCard}.`;

                    resultEl.innerText = `Cut ${cutAmount} cards (${formattedCard}).`;
                    resultEl.style.display = 'block';

                    speakResult(outputText);
                } else {
                    resetToListening();
                }
            } else {
                resetToListening();
            }
        }

        async function speakResult(text) {
            isSpeaking = true;
            statusEl.innerText = "Speaking...";
            statusEl.style.color = "#9d84ff"; 

            // Mute mic track during playback so Bluetooth audio doesn't conflict
            if (audioStream) {
                audioStream.getAudioTracks().forEach(t => t.enabled = false);
            }

            // Fail-safe timer so it can never freeze on "Speaking..."
            speechFailSafeTimeout = setTimeout(() => {
                resetToListening();
            }, 6000);

            try {
                const res = await fetch('/api/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'tts', text: text })
                });
                const data = await res.json();

                if (data.audio) {
                    audioPlayer.src = `data:audio/mp3;base64,${data.audio}`;
                    audioPlayer.onended = () => resetToListening();
                    audioPlayer.onerror = () => resetToListening();
                    await audioPlayer.play();
                } else {
                    resetToListening();
                }
            } catch (e) {
                resetToListening();
            }
        }
    </script>
</body>
</html>
