<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACAAN</title>
    <style>
        body {
            background-color: #0f111a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        h1 { color: #9d84ff; font-size: 2rem; margin-bottom: 10px; }
        #status { font-size: 1.2rem; margin-top: 20px; color: #a0a5b5; transition: color 0.15s; }
        #debug { font-size: 0.9rem; margin-top: 10px; color: #777; font-style: italic; min-height: 24px; padding: 0 20px; }
        #result { font-size: 1.4rem; margin-top: 30px; font-weight: bold; color: #ffffff; padding: 20px; border-radius: 10px; background: #232533; display: none; width: 80%; }
        #app-content { display: flex; flex-direction: column; align-items: center; width: 100%; }
    </style>
</head>
<body>

    <div id="app-content">
        <h1>ACAAN</h1>
        <div id="status">Initializing...</div>
        <div id="debug">Speak card and position</div>
        <div id="result"></div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const debugEl = document.getElementById('debug');
        const resultEl = document.getElementById('result');

        let isSpeaking = false;
        let isAnalyzing = false;
        let isRecording = false;
        let speechFailSafeTimeout = null;
        
        let audioContext = null;
        let audioStream = null;
        let processorNode = null;
        let silenceTimer = null;
        let maxRecordTimer = null;

        let preRollChunks = [];
        let recordedChunks = [];
        const PRE_ROLL_MAX_CHUNKS = 5; 

        // Two-way memory
        let pendingCard = null;
        let pendingPosition = null;
        let pendingTimer = null;

        // Pre-cached audio alerts for instant pocket feedback
        let cachedRepeatBase64 = null;
        let cachedNumberBase64 = null;
        let cachedCardBase64 = null;

        function unlockAudioContext() {
            if (!audioContext) return;
            if (audioContext.state !== 'running') {
                audioContext.resume().catch(() => {});
            }
            try {
                const buffer = audioContext.createBuffer(1, 1, 22050);
                const source = audioContext.createBufferSource();
                source.buffer = buffer;
                source.connect(audioContext.destination);
                source.start(0);
            } catch (e) {}
        }
        document.body.addEventListener('touchstart', unlockAudioContext, { passive: true });
        document.body.addEventListener('touchend', unlockAudioContext, { passive: true });
        document.body.addEventListener('click', unlockAudioContext);

        async function preloadAlerts() {
            const fetchAudio = async (text) => {
                try {
                    const res = await fetch('/api/transcribe', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'tts', text: text })
                    });
                    const data = await res.json();
                    return data.audio || null;
                } catch (e) { return null; }
            };
            
            cachedRepeatBase64 = await fetchAudio("Repeat.");
            cachedNumberBase64 = await fetchAudio("Number.");
            cachedCardBase64 = await fetchAudio("Card.");
        }

        async function startListening() {
            if (audioStream) return; 

            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const sourceNode = audioContext.createMediaStreamSource(audioStream);

                processorNode = audioContext.createScriptProcessor(2048, 1, 1);
                const silentGain = audioContext.createGain();
                silentGain.gain.value = 0;

                sourceNode.connect(processorNode);
                processorNode.connect(silentGain);
                silentGain.connect(audioContext.destination);

                processorNode.onaudioprocess = (e) => {
                    if (isSpeaking || isAnalyzing) return;

                    const inputData = e.inputBuffer.getChannelData(0);
                    const chunkCopy = new Float32Array(inputData);

                    let maxPeak = 0;
                    for (let i = 0; i < chunkCopy.length; i++) {
                        const abs = Math.abs(chunkCopy[i]);
                        if (abs > maxPeak) maxPeak = abs;
                    }
                    const displayLevel = Math.min(99, Math.round(maxPeak * 140));
                    const SPEECH_THRESHOLD = 8;

                    if (!isRecording) {
                        preRollChunks.push(chunkCopy);
                        if (preRollChunks.length > PRE_ROLL_MAX_CHUNKS) {
                            preRollChunks.shift();
                        }
                        statusEl.innerText = `Listening... (${displayLevel})`;
                        statusEl.style.color = "#a0a5b5";
                    } else {
                        recordedChunks.push(chunkCopy);
                    }

                    if (displayLevel > SPEECH_THRESHOLD) {
                        if (!isRecording) {
                            isRecording = true;
                            recordedChunks = [...preRollChunks, chunkCopy];
                            preRollChunks = [];
                            statusEl.innerText = "Recording...";
                            statusEl.style.color = "#ff5555";

                            if (pendingTimer) clearTimeout(pendingTimer);

                            maxRecordTimer = setTimeout(() => {
                                if (isRecording) finishRecordingAndTranscribe();
                            }, 4200);
                        }

                        clearTimeout(silenceTimer);
                        silenceTimer = setTimeout(() => {
                            if (isRecording) finishRecordingAndTranscribe();
                        }, 750);
                    }
                };

                resetToListening();
                preloadAlerts();

            } catch (err) {
                statusEl.innerText = "Mic Permission Denied";
            }
        }

        function encodeWAV(chunks, inputSampleRate) {
            let endIdx = chunks.length;
            while (endIdx > 4) {
                const c = chunks[endIdx - 1];
                let peak = 0;
                for (let i = 0; i < c.length; i++) {
                    const a = Math.abs(c[i]);
                    if (a > peak) peak = a;
                }
                if (peak * 140 < 6) endIdx--;
                else break;
            }
            const trimmedChunks = chunks.slice(0, endIdx);

            let totalLength = 0;
            for (const c of trimmedChunks) totalLength += c.length;
            const merged = new Float32Array(totalLength);
            let offset = 0;
            for (const c of trimmedChunks) {
                merged.set(c, offset);
                offset += c.length;
            }

            const targetRate = 8000;
            const ratio = inputSampleRate / targetRate;
            const newLength = Math.round(merged.length / ratio);
            const buffer = new ArrayBuffer(44 + newLength * 2);
            const view = new DataView(buffer);

            const writeString = (off, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i));
            };

            writeString(0, 'RIFF');
            view.setUint32(4, 36 + newLength * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, targetRate, true);
            view.setUint32(28, targetRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, newLength * 2, true);

            let outOffset = 44;
            for (let i = 0; i < newLength; i++) {
                const sampleIndex = Math.min(merged.length - 1, Math.floor(i * ratio));
                const s = Math.max(-1, Math.min(1, merged[sampleIndex]));
                view.setInt16(outOffset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                outOffset += 2;
            }

            const bytes = new Uint8Array(buffer);
            let binary = '';
            const chunkSize = 8192;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return window.btoa(binary);
        }

        async function finishRecordingAndTranscribe() {
            clearTimeout(silenceTimer);
            clearTimeout(maxRecordTimer);
            isRecording = false;

            const chunksToProcess = recordedChunks;
            recordedChunks = [];

            if (chunksToProcess.length === 0) {
                resetToListening();
                return;
            }

            isAnalyzing = true;
            statusEl.innerText = "Analyzing...";
            statusEl.style.color = "#ffb86c";

            try {
                const sampleRate = audioContext ? audioContext.sampleRate : 44100;
                const base64Wav = encodeWAV(chunksToProcess, sampleRate);

                const res = await fetch('/api/transcribe', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        audio: base64Wav,
                        pendingCard: pendingCard,
                        pendingPosition: pendingPosition
                    })
                });
                const data = await res.json();
                isAnalyzing = false;

                if (data.error) {
                    debugEl.innerText = `Error: ${data.error}`;
                    resetToListening();
                    return;
                }

                if (data.resolved) {
                    clearTimeout(pendingTimer);
                    pendingCard = null;
                    pendingPosition = null;

                    debugEl.innerText = data.debugText;
                    resultEl.innerText = data.resultText;
                    resultEl.style.display = 'block';

                    if (data.audio) {
                        playBase64Audio(data.audio);
                    } else {
                        resetToListening();
                    }
                    return;
                }

                handleUnresolvedSpeech(data);
            } catch (e) {
                isAnalyzing = false;
                debugEl.innerText = "Connection error.";
                resetToListening();
            }
        }

        function startPendingTimeout() {
            clearTimeout(pendingTimer);
            pendingTimer = setTimeout(() => {
                if (pendingCard || pendingPosition) {
                    pendingCard = null;
                    pendingPosition = null;
                    debugEl.innerText = "Timed out waiting for second part.";
                    playAlert('repeat');
                }
            }, 12000);
        }

        function playAlert(type) {
            let base64 = null;
            let fallback = "";
            
            if (type === 'repeat') { base64 = cachedRepeatBase64; fallback = "Repeat."; }
            else if (type === 'number') { base64 = cachedNumberBase64; fallback = "Number."; }
            else if (type === 'card') { base64 = cachedCardBase64; fallback = "Card."; }
            
            if (base64) playBase64Audio(base64);
            else speakFallback(fallback);
        }

        function handleUnresolvedSpeech(data) {
            const rawText = data.text || "";

            // Card spoken first -> Request number
            if (data.card && !data.position) {
                pendingCard = data.card;
                const formatted = data.card.replace(/\b\w/g, c => c.toUpperCase());
                debugEl.innerText = `Locked: ${formatted} — Say position...`;
                startPendingTimeout();
                playAlert('number');
                return;
            }

            // Position spoken first -> Request card
            if (!data.card && data.position) {
                pendingPosition = data.position;
                debugEl.innerText = `Locked Position: ${data.position} — Say card...`;
                startPendingTimeout();
                playAlert('card');
                return;
            }

            // Missed part of the suit/value
            if (data.partialCardAttempt) {
                debugEl.innerText = `Missed card value: "${rawText}"`;
                playAlert('repeat');
                return;
            }

            if (pendingCard) {
                debugEl.innerText = `Locked: ${pendingCard.toUpperCase()} — Waiting for number...`;
            } else if (pendingPosition) {
                debugEl.innerText = `Locked Position: ${pendingPosition} — Waiting for card...`;
            } else {
                debugEl.innerText = `Ignored chatter: "${rawText}"`;
            }
            resetToListening();
        }

        async function playBase64Audio(base64Audio) {
            isSpeaking = true;
            statusEl.innerText = "Speaking...";
            statusEl.style.color = "#9d84ff";

            speechFailSafeTimeout = setTimeout(() => {
                resetToListening();
            }, 6000);

            try {
                if (audioContext && audioContext.state !== 'running') {
                    await audioContext.resume().catch(() => {});
                }

                const binaryString = window.atob(base64Audio);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                audioContext.decodeAudioData(
                    bytes.buffer,
                    (decodedBuffer) => {
                        const bufferSource = audioContext.createBufferSource();
                        bufferSource.buffer = decodedBuffer;
                        bufferSource.connect(audioContext.destination);
                        bufferSource.onended = () => {
                            setTimeout(resetToListening, 200);
                        };
                        bufferSource.start(0);
                    },
                    () => resetToListening()
                );
            } catch (e) {
                resetToListening();
            }
        }

        async function speakFallback(text) {
            try {
                const res = await fetch('/api/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'tts', text: text })
                });
                const data = await res.json();
                if (data.audio) playBase64Audio(data.audio);
                else resetToListening();
            } catch (e) {
                resetToListening();
            }
        }

        function resetToListening() {
            isSpeaking = false;
            isAnalyzing = false;
            clearTimeout(speechFailSafeTimeout);
            if (audioContext && audioContext.state !== 'running') {
                audioContext.resume().catch(() => {});
            }
            statusEl.innerText = "Listening...";
            statusEl.style.color = "#a0a5b5";
        }

        function stopListening() {
            clearTimeout(silenceTimer);
            clearTimeout(maxRecordTimer);
            clearTimeout(speechFailSafeTimeout);
            clearTimeout(pendingTimer);
            if (processorNode) {
                try { processorNode.disconnect(); } catch (e) {}
                processorNode = null;
            }
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
                audioStream = null;
            }
            if (audioContext) {
                audioContext.close().catch(() => {});
                audioContext = null;
            }
            isRecording = false;
            isSpeaking = false;
            isAnalyzing = false;
            statusEl.innerText = "Paused";
        }

        window.addEventListener('load', startListening);

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopListening();
            } else {
                startListening();
            }
        });
    </script>
</body>
</html>
