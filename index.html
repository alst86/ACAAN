<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACAAN</title>
    <style>
        body {
            background-color: #0f111a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        h1 { color: #9d84ff; font-size: 2rem; margin-bottom: 10px; }
        #status { font-size: 1.2rem; margin-top: 20px; color: #a0a5b5; transition: color 0.2s; }
        #debug { font-size: 0.9rem; margin-top: 10px; color: #777; font-style: italic; min-height: 24px; padding: 0 20px; }
        #result { font-size: 1.4rem; margin-top: 30px; font-weight: bold; color: #ffffff; padding: 20px; border-radius: 10px; background: #232533; display: none; width: 80%; }
        #app-content { display: flex; flex-direction: column; align-items: center; width: 100%; }
    </style>
</head>
<body>

    <div id="app-content">
        <h1>ACAAN</h1>
        <div id="status">Initializing...</div>
        <div id="debug">Speak card and position</div>
        <div id="result"></div>
    </div>

    <script>
        const stack = [
            "4 of clubs", "2 of hearts", "7 of diamonds", "3 of clubs", "4 of hearts", "6 of diamonds", "ace of spades", "5 of hearts", "9 of spades", "2 of spades",
            "queen of hearts", "3 of diamonds", "queen of clubs", "8 of hearts", "6 of spades", "5 of spades", "9 of hearts", "king of clubs", "2 of diamonds", "jack of hearts",
            "3 of spades", "8 of spades", "6 of hearts", "10 of clubs", "5 of diamonds", "king of diamonds", "2 of clubs", "3 of hearts", "8 of diamonds", "5 of clubs",
            "king of spades", "jack of diamonds", "8 of clubs", "10 of spades", "king of hearts", "jack of clubs", "7 of spades", "10 of hearts", "ace of diamonds", "4 of spades",
            "7 of hearts", "4 of diamonds", "ace of clubs", "9 of clubs", "jack of spades", "queen of diamonds", "7 of clubs", "queen of spades", "10 of diamonds", "6 of clubs",
            "ace of hearts", "9 of diamonds"
        ];

        const statusEl = document.getElementById('status');
        const debugEl = document.getElementById('debug');
        const resultEl = document.getElementById('result');

        let isSpeaking = false;
        let speechFailSafeTimeout = null;
        
        let audioContext = null;
        let mediaRecorder = null;
        let audioStream = null;
        let sourceNode = null;
        let audioChunks = [];
        let isRecording = false;
        let silenceTimer = null;
        let maxRecordTimer = null;
        let analyser = null;
        let dataArray = null;
        let animationFrameId = null;
        let zeroFramesCount = 0;

        // Safely wake AudioContext on any touch without using a separate <audio> tag
        function wakeAudioEngine() {
            if (audioContext && audioContext.state !== 'running') {
                audioContext.resume().catch(() => {});
            }
        }
        document.body.addEventListener('touchend', wakeAudioEngine);
        document.body.addEventListener('click', wakeAudioEngine);

        function setupAudioAnalyser() {
            if (!audioStream) return;
            try {
                if (!audioContext || audioContext.state === 'closed') {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state !== 'running') {
                    audioContext.resume().catch(() => {});
                }
                if (sourceNode) {
                    try { sourceNode.disconnect(); } catch (e) {}
                }
                sourceNode = audioContext.createMediaStreamSource(audioStream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;
                sourceNode.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                zeroFramesCount = 0;
            } catch (e) {}
        }

        async function startListening() {
            if (audioStream) return; 

            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                setupAudioAnalyser();

                mediaRecorder = new MediaRecorder(audioStream);
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                
                mediaRecorder.onstop = async () => {
                    clearTimeout(silenceTimer);
                    clearTimeout(maxRecordTimer);
                    isRecording = false;

                    if (audioChunks.length === 0) {
                        resetToListening();
                        return;
                    }
                    const audioBlob = new Blob(audioChunks, { type: 'audio/mp4' });
                    audioChunks = []; 
                    
                    statusEl.innerText = "Analyzing...";
                    statusEl.style.color = "#ffb86c"; 
                    
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = async () => {
                        const base64data = reader.result.split(',')[1];
                        
                        try {
                            const res = await fetch('/api/transcribe', { 
                                method: 'POST', 
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ audio: base64data })
                            });
                            const data = await res.json();
                            
                            if (data.error) {
                                debugEl.innerText = `Error: ${data.error}`;
                                resetToListening();
                                return;
                            }
                            
                            if (data.text) {
                                processSpeechInput(data.text);
                            } else {
                                resetToListening();
                            }
                        } catch (e) {
                            debugEl.innerText = "Connection error.";
                            resetToListening();
                        }
                    };
                };

                resetToListening();
                monitorAudioLevel();

            } catch (err) {
                statusEl.innerText = "Mic Permission Denied";
            }
        }

        function resetToListening() {
            isSpeaking = false;
            clearTimeout(speechFailSafeTimeout);
            if (audioContext && audioContext.state !== 'running') {
                audioContext.resume().catch(() => {});
            }
            statusEl.innerText = "Listening...";
            statusEl.style.color = "#a0a5b5";
        }

        function stopListening() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
                audioStream = null;
            }
            if (audioContext) {
                audioContext.close().catch(() => {});
                audioContext = null;
            }
            clearTimeout(silenceTimer);
            clearTimeout(maxRecordTimer);
            clearTimeout(speechFailSafeTimeout);
            isRecording = false;
            isSpeaking = false;
            statusEl.innerText = "Paused";
        }

        window.addEventListener('load', startListening);

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopListening();
            } else {
                startListening();
            }
        });

        function monitorAudioLevel() {
            if (!analyser || !audioStream) return;

            // Catch both 'suspended' and iOS 'interrupted' states
            if (audioContext && audioContext.state !== 'running') {
                audioContext.resume().catch(() => {});
            }

            if (isSpeaking) {
                animationFrameId = requestAnimationFrame(monitorAudioLevel);
                return;
            }

            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            let average = Math.round(sum / dataArray.length);

            // Auto-heal watchdog if iOS ever zeroes out the audio graph
            if (average === 0) {
                zeroFramesCount++;
                if (zeroFramesCount > 120) {
                    setupAudioAnalyser();
                }
            } else {
                zeroFramesCount = 0;
            }

            const SPEECH_THRESHOLD = 9; 

            if (!isRecording && statusEl.innerText.startsWith("Listening")) {
                statusEl.innerText = `Listening... (${average})`;
            }

            if (average > SPEECH_THRESHOLD) {
                if (!isRecording && mediaRecorder && mediaRecorder.state === 'inactive') {
                    isRecording = true;
                    mediaRecorder.start();
                    statusEl.innerText = "Recording...";
                    statusEl.style.color = "#ff5555"; 

                    maxRecordTimer = setTimeout(() => {
                        if (isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') {
                            isRecording = false;
                            mediaRecorder.stop();
                        }
                    }, 5000);
                }
                
                clearTimeout(silenceTimer);
                
                silenceTimer = setTimeout(() => {
                    if (isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') {
                        isRecording = false;
                        mediaRecorder.stop(); 
                    }
                }, 1400); 
            }
            
            animationFrameId = requestAnimationFrame(monitorAudioLevel);
        }

        function parseCardAndPosition(rawText) {
            const cleanRaw = rawText.trim();

            if (
                cleanRaw.length < 2 ||
                /^(you|thank you|thanks|bye|okay|oh|uh|um)$/i.test(cleanRaw) ||
                /thank you for|watching|joining|subtitles|amara\.org/i.test(cleanRaw)
            ) {
                return { valid: false, partialCardHeard: false };
            }

            let text = cleanRaw.toLowerCase().replace(/[.,!?-]/g, ' ').replace(/\s+/g, ' ').trim();

            const wordToNum = {
                'one': '1', 'two': '2', 'to': '2', 'too': '2', 'three': '3', 'tree': '3',
                'four': '4', 'for': '4', 'ford': '4', 'five': '5', 'six': '6', 'seven': '7',
                'eight': '8', 'ate': '8', 'nine': '9', 'ten': '10',
                'eleven': '11', 'twelve': '12', 'thirteen': '13', 'fourteen': '14', 'fifteen': '15',
                'sixteen': '16', 'seventeen': '17', 'eighteen': '18', 'nineteen': '19', 'twenty': '20',
                'thirty': '30', 'forty': '40', 'fifty': '50'
            };

            for (const [w, n] of Object.entries(wordToNum)) {
                text = text.replace(new RegExp(`\\b${w}\\b`, 'g'), n);
            }
            text = text.replace(/\b(20|30|40|50)\s+([1-9])\b/g, (m, tens, ones) => String(parseInt(tens) + parseInt(ones)));

            text = text.replace(/\b1\s+(?:2|to)\s+52\b/g, ' ')
                       .replace(/\b52\s+cards?\b/g, ' ');

            const hasSuitKeyword = /\b(clubs?|clovers?|flowers?|hearts?|spades?|diamonds?)\b/.test(text);
            const hasFaceKeyword = /\b(ace|jack|queen|king)\b/.test(text);

            if (!hasSuitKeyword) {
                return { valid: false, partialCardHeard: hasFaceKeyword };
            }

            const pairedCardRegex = /\b(ace|jack|queen|king|10|[2-9])(?:\s+(?:of|in|on|at|4|2))?\s+(clubs?|clovers?|flowers?|hearts?|spades?|diamonds?)\b/;
            const pairedMatch = text.match(pairedCardRegex);

            let value = null;
            let rawSuit = null;
            let remainingText = text;

            if (pairedMatch) {
                value = pairedMatch[1];
                rawSuit = pairedMatch[2];
                remainingText = text.replace(pairedMatch[0], ' ');
            } else {
                const suitMatch = text.match(/\b(clubs?|clovers?|flowers?|hearts?|spades?|diamonds?)\b/);
                const valueMatch = text.match(/\b(ace|jack|queen|king|10|[2-9])\b/);
                if (!suitMatch || !valueMatch) {
                    return { valid: false, partialCardHeard: true };
                }
                value = valueMatch[1];
                rawSuit = suitMatch[1];
                remainingText = text.replace(valueMatch[0], ' ').replace(suitMatch[0], ' ');
            }

            let suit = rawSuit;
            if (suit.startsWith('club') || suit.startsWith('clover') || suit.startsWith('flower')) suit = 'clubs';
            else if (suit.startsWith('heart')) suit = 'hearts';
            else if (suit.startsWith('spade')) suit = 'spades';
            else if (suit.startsWith('diamond')) suit = 'diamonds';

            const targetCard = `${value} of ${suit}`;
            const cardIndex = stack.indexOf(targetCard);
            if (cardIndex === -1) {
                return { valid: false, partialCardHeard: true };
            }

            const numbersFound = remainingText.match(/\b([1-9]|[1-4][0-9]|5[0-2])\b/g);
            if (!numbersFound || numbersFound.length === 0) {
                return { valid: false, partialCardHeard: true };
            }

            const targetPosition = parseInt(numbersFound[numbersFound.length - 1], 10);

            return {
                valid: true,
                card: targetCard,
                cardIndex: cardIndex,
                position: targetPosition
            };
        }

        function processSpeechInput(rawText) {
            const parsed = parseCardAndPosition(rawText);

            if (!parsed.valid) {
                if (parsed.partialCardHeard) {
                    debugEl.innerText = `Missed part of card: "${rawText}"`;
                    speakResult("Repeat.");
                } else {
                    debugEl.innerText = `Ignored chatter: "${rawText}"`;
                    resetToListening();
                }
                return;
            }

            const currentPosition = parsed.cardIndex + 1; 
            const targetPosition = parsed.position;
            const formattedHeardCard = parsed.card.replace(/\b\w/g, c => c.toUpperCase());

            let cutAmount = currentPosition - targetPosition;
            if (cutAmount < 0) cutAmount += 52;

            if (cutAmount === 0) {
                debugEl.innerText = `${formattedHeardCard} at ${targetPosition}`;
                resultEl.innerText = `Cut 0 (${formattedHeardCard})`;
                resultEl.style.display = 'block';
                speakResult(`${formattedHeardCard}, ${targetPosition}. Cut zero.`);
                return;
            }

            const bottomCardIndex = (cutAmount - 1 + 52) % 52;
            const bottomCard = stack[bottomCardIndex];
            const formattedBottom = bottomCard.replace(/\b\w/g, c => c.toUpperCase());
            
            const outputText = `${formattedHeardCard}, ${targetPosition}. Cut ${cutAmount}, ${formattedBottom}.`;

            debugEl.innerText = `${formattedHeardCard} at ${targetPosition}`;
            resultEl.innerText = `Cut ${cutAmount} (${formattedBottom})`;
            resultEl.style.display = 'block';

            speakResult(outputText);
        }

        // Plays TTS directly through WebAudio so iOS never interrupts the microphone
        async function speakResult(text) {
            isSpeaking = true;
            statusEl.innerText = "Speaking...";
            statusEl.style.color = "#9d84ff"; 

            speechFailSafeTimeout = setTimeout(() => {
                resetToListening();
            }, 7000);

            try {
                const res = await fetch('/api/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'tts', text: text })
                });
                const data = await res.json();

                if (data.audio && audioContext) {
                    if (audioContext.state !== 'running') {
                        await audioContext.resume().catch(() => {});
                    }

                    const binaryString = window.atob(data.audio);
                    const len = binaryString.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }

                    audioContext.decodeAudioData(
                        bytes.buffer,
                        (decodedBuffer) => {
                            const bufferSource = audioContext.createBufferSource();
                            bufferSource.buffer = decodedBuffer;
                            bufferSource.connect(audioContext.destination);
                            bufferSource.onended = () => {
                                // Brief 300ms pause so mic doesn't catch trailing echo
                                setTimeout(resetToListening, 300);
                            };
                            bufferSource.start(0);
                        },
                        () => {
                            resetToListening();
                        }
                    );
                } else {
                    resetToListening();
                }
            } catch (e) {
                resetToListening();
            }
        }
    </script>
</body>
</html>
