<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACAAN</title>
    <style>
        body {
            background-color: #0f111a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        h1 { color: #9d84ff; font-size: 2rem; margin-bottom: 10px; }
        #status { font-size: 1.2rem; margin-top: 20px; color: #a0a5b5; transition: color 0.2s; }
        #debug { font-size: 0.9rem; margin-top: 10px; color: #777; font-style: italic; min-height: 24px; padding: 0 20px; }
        #result { font-size: 1.4rem; margin-top: 30px; font-weight: bold; color: #ffffff; padding: 20px; border-radius: 10px; background: #232533; display: none; width: 80%; }
        #app-content { display: flex; flex-direction: column; align-items: center; width: 100%; }
    </style>
</head>
<body>

    <div id="app-content">
        <h1>ACAAN</h1>
        <div id="status">Initializing...</div>
        <div id="debug">Speak card and position</div>
        <div id="result"></div>
    </div>

    <script>
        const stack = [
            "4 of clubs", "2 of hearts", "7 of diamonds", "3 of clubs", "4 of hearts", "6 of diamonds", "ace of spades", "5 of hearts", "9 of spades", "2 of spades",
            "queen of hearts", "3 of diamonds", "queen of clubs", "8 of hearts", "6 of spades", "5 of spades", "9 of hearts", "king of clubs", "2 of diamonds", "jack of hearts",
            "3 of spades", "8 of spades", "6 of hearts", "10 of clubs", "5 of diamonds", "king of diamonds", "2 of clubs", "3 of hearts", "8 of diamonds", "5 of clubs",
            "king of spades", "jack of diamonds", "8 of clubs", "10 of spades", "king of hearts", "jack of clubs", "7 of spades", "10 of hearts", "ace of diamonds", "4 of spades",
            "7 of hearts", "4 of diamonds", "ace of clubs", "9 of clubs", "jack of spades", "queen of diamonds", "7 of clubs", "queen of spades", "10 of diamonds", "6 of clubs",
            "ace of hearts", "9 of diamonds"
        ];

        const statusEl = document.getElementById('status');
        const debugEl = document.getElementById('debug');
        const resultEl = document.getElementById('result');

        let isSpeaking = false;
        let isAnalyzing = false;
        let isRecording = false;
        let speechFailSafeTimeout = null;
        
        let audioContext = null;
        let audioStream = null;
        let processorNode = null;
        let silenceTimer = null;
        let maxRecordTimer = null;

        // Raw PCM Recording Buffers (No MediaRecorder needed)
        let preRollChunks = [];
        let recordedChunks = [];
        const PRE_ROLL_MAX_CHUNKS = 6; // ~0.5s pre-roll so first word is never clipped

        // 2-Breath Memory if card and number are spoken with a pause between them
        let pendingCard = null;
        let pendingCardTimer = null;

        function unlockAudioContext() {
            if (!audioContext) return;
            if (audioContext.state !== 'running') {
                audioContext.resume().catch(() => {});
            }
            try {
                const buffer = audioContext.createBuffer(1, 1, 22050);
                const source = audioContext.createBufferSource();
                source.buffer = buffer;
                source.connect(audioContext.destination);
                source.start(0);
            } catch (e) {}
        }
        document.body.addEventListener('touchstart', unlockAudioContext, { passive: true });
        document.body.addEventListener('touchend', unlockAudioContext, { passive: true });
        document.body.addEventListener('click', unlockAudioContext);

        async function startListening() {
            if (audioStream) return; 

            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const sourceNode = audioContext.createMediaStreamSource(audioStream);

                // Direct PCM capture node — bypasses buggy iOS MediaRecorder completely
                processorNode = audioContext.createScriptProcessor(4096, 1, 1);
                const silentGain = audioContext.createGain();
                silentGain.gain.value = 0;

                sourceNode.connect(processorNode);
                processorNode.connect(silentGain);
                silentGain.connect(audioContext.destination);

                processorNode.onaudioprocess = (e) => {
                    if (isSpeaking || isAnalyzing) return;

                    const inputData = e.inputBuffer.getChannelData(0);
                    const chunkCopy = new Float32Array(inputData);

                    // Calculate peak level (0 - 100 scale)
                    let maxPeak = 0;
                    for (let i = 0; i < chunkCopy.length; i++) {
                        const abs = Math.abs(chunkCopy[i]);
                        if (abs > maxPeak) maxPeak = abs;
                    }
                    const displayLevel = Math.min(99, Math.round(maxPeak * 140));
                    const SPEECH_THRESHOLD = 8;

                    if (!isRecording) {
                        // Maintain rolling 0.5s pre-roll buffer
                        preRollChunks.push(chunkCopy);
                        if (preRollChunks.length > PRE_ROLL_MAX_CHUNKS) {
                            preRollChunks.shift();
                        }
                        statusEl.innerText = `Listening... (${displayLevel})`;
                        statusEl.style.color = "#a0a5b5";
                    } else {
                        recordedChunks.push(chunkCopy);
                    }

                    if (displayLevel > SPEECH_THRESHOLD) {
                        if (!isRecording) {
                            isRecording = true;
                            // Prepend pre-roll so the start of the word is never cut off
                            recordedChunks = [...preRollChunks, chunkCopy];
                            preRollChunks = [];
                            statusEl.innerText = "Recording...";
                            statusEl.style.color = "#ff5555";

                            // Pause pending-card timeout while user is actively speaking
                            if (pendingCardTimer) {
                                clearTimeout(pendingCardTimer);
                            }

                            maxRecordTimer = setTimeout(() => {
                                if (isRecording) finishRecordingAndTranscribe();
                            }, 5500);
                        }

                        clearTimeout(silenceTimer);
                        silenceTimer = setTimeout(() => {
                            if (isRecording) finishRecordingAndTranscribe();
                        }, 1600);
                    }
                };

                resetToListening();

            } catch (err) {
                statusEl.innerText = "Mic Permission Denied";
            }
        }

        // Encode raw Float32 audio into a compact 16kHz Mono WAV file
        function encodeWAV(chunks, inputSampleRate) {
            let totalLength = 0;
            for (const c of chunks) totalLength += c.length;
            const merged = new Float32Array(totalLength);
            let offset = 0;
            for (const c of chunks) {
                merged.set(c, offset);
                offset += c.length;
            }

            const targetRate = 16000;
            const ratio = inputSampleRate / targetRate;
            const newLength = Math.round(merged.length / ratio);
            const buffer = new ArrayBuffer(44 + newLength * 2);
            const view = new DataView(buffer);

            const writeString = (off, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i));
            };

            writeString(0, 'RIFF');
            view.setUint32(4, 36 + newLength * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, targetRate, true);
            view.setUint32(28, targetRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, newLength * 2, true);

            let outOffset = 44;
            for (let i = 0; i < newLength; i++) {
                const sampleIndex = Math.min(merged.length - 1, Math.floor(i * ratio));
                const s = Math.max(-1, Math.min(1, merged[sampleIndex]));
                view.setInt16(outOffset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                outOffset += 2;
            }

            const bytes = new Uint8Array(buffer);
            let binary = '';
            const chunkSize = 8192;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return window.btoa(binary);
        }

        async function finishRecordingAndTranscribe() {
            clearTimeout(silenceTimer);
            clearTimeout(maxRecordTimer);
            isRecording = false;

            const chunksToProcess = recordedChunks;
            recordedChunks = [];

            if (chunksToProcess.length === 0) {
                resetToListening();
                return;
            }

            isAnalyzing = true;
            statusEl.innerText = "Analyzing...";
            statusEl.style.color = "#ffb86c";

            try {
                const sampleRate = audioContext ? audioContext.sampleRate : 44100;
                const base64Wav = encodeWAV(chunksToProcess, sampleRate);

                const res = await fetch('/api/transcribe', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ audio: base64Wav })
                });
                const data = await res.json();
                isAnalyzing = false;

                if (data.error) {
                    debugEl.innerText = `Error: ${data.error}`;
                    resetToListening();
                    return;
                }

                if (data.text) {
                    processSpeechInput(data.text);
                } else {
                    resetToListening();
                }
            } catch (e) {
                isAnalyzing = false;
                debugEl.innerText = "Connection error.";
                resetToListening();
            }
        }

        function resetToListening() {
            isSpeaking = false;
            isAnalyzing = false;
            clearTimeout(speechFailSafeTimeout);
            if (audioContext && audioContext.state !== 'running') {
                audioContext.resume().catch(() => {});
            }
            statusEl.innerText = "Listening...";
            statusEl.style.color = "#a0a5b5";
        }

        function stopListening() {
            clearTimeout(silenceTimer);
            clearTimeout(maxRecordTimer);
            clearTimeout(speechFailSafeTimeout);
            clearTimeout(pendingCardTimer);
            if (processorNode) {
                try { processorNode.disconnect(); } catch (e) {}
                processorNode = null;
            }
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
                audioStream = null;
            }
            if (audioContext) {
                audioContext.close().catch(() => {});
                audioContext = null;
            }
            isRecording = false;
            isSpeaking = false;
            isAnalyzing = false;
            statusEl.innerText = "Paused";
        }

        window.addEventListener('load', startListening);

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopListening();
            } else {
                startListening();
            }
        });

        function extractElements(rawText) {
            const cleanRaw = rawText.trim();

            if (
                cleanRaw.length < 1 ||
                /^(you|thank you|thanks|bye|okay|oh|uh|um)$/i.test(cleanRaw) ||
                /thank you for|watching|joining|subtitles|amara\.org/i.test(cleanRaw)
            ) {
                return { card: null, position: null, partialCardAttempt: false };
            }

            let text = cleanRaw.toLowerCase().replace(/[.,!?-]/g, ' ').replace(/\s+/g, ' ').trim();

            const wordToNum = {
                'one': '1', 'two': '2', 'to': '2', 'too': '2', 'three': '3', 'tree': '3',
                'four': '4', 'for': '4', 'ford': '4', 'five': '5', 'six': '6', 'seven': '7',
                'eight': '8', 'ate': '8', 'nine': '9', 'ten': '10',
                'eleven': '11', 'twelve': '12', 'thirteen': '13', 'fourteen': '14', 'fifteen': '15',
                'sixteen': '16', 'seventeen': '17', 'eighteen': '18', 'nineteen': '19', 'twenty': '20',
                'thirty': '30', 'forty': '40', 'fifty': '50'
            };

            for (const [w, n] of Object.entries(wordToNum)) {
                text = text.replace(new RegExp(`\\b${w}\\b`, 'g'), n);
            }
            text = text.replace(/\b(20|30|40|50)\s+([1-9])\b/g, (m, tens, ones) => String(parseInt(tens) + parseInt(ones)));

            text = text.replace(/\b1\s+(?:2|to)\s+52\b/g, ' ')
                       .replace(/\b52\s+cards?\b/g, ' ');

            const hasSuitKeyword = /\b(clubs?|clovers?|flowers?|hearts?|spades?|diamonds?)\b/.test(text);
            const hasFaceKeyword = /\b(ace|jack|queen|king)\b/.test(text);

            let detectedCard = null;
            let remainingText = text;

            if (hasSuitKeyword) {
                const pairedCardRegex = /\b(ace|jack|queen|king|10|[2-9])(?:\s+(?:of|in|on|at|4|2))?\s+(clubs?|clovers?|flowers?|hearts?|spades?|diamonds?)\b/;
                const pairedMatch = text.match(pairedCardRegex);

                let value = null;
                let rawSuit = null;

                if (pairedMatch) {
                    value = pairedMatch[1];
                    rawSuit = pairedMatch[2];
                    remainingText = text.replace(pairedMatch[0], ' ');
                } else {
                    const suitMatch = text.match(/\b(clubs?|clovers?|flowers?|hearts?|spades?|diamonds?)\b/);
                    const valueMatch = text.match(/\b(ace|jack|queen|king|10|[2-9])\b/);
                    if (suitMatch && valueMatch) {
                        value = valueMatch[1];
                        rawSuit = suitMatch[1];
                        remainingText = text.replace(valueMatch[0], ' ').replace(suitMatch[0], ' ');
                    }
                }

                if (value && rawSuit) {
                    let suit = rawSuit;
                    if (suit.startsWith('club') || suit.startsWith('clover') || suit.startsWith('flower')) suit = 'clubs';
                    else if (suit.startsWith('heart')) suit = 'hearts';
                    else if (suit.startsWith('spade')) suit = 'spades';
                    else if (suit.startsWith('diamond')) suit = 'diamonds';

                    const candidate = `${value} of ${suit}`;
                    if (stack.indexOf(candidate) !== -1) {
                        detectedCard = candidate;
                    }
                }
            }

            const numbersFound = remainingText.match(/\b([1-9]|[1-4][0-9]|5[0-2])\b/g);
            const detectedPosition = (numbersFound && numbersFound.length > 0)
                ? parseInt(numbersFound[numbersFound.length - 1], 10)
                : null;

            return {
                card: detectedCard,
                position: detectedPosition,
                partialCardAttempt: (hasSuitKeyword || hasFaceKeyword) && !detectedCard
            };
        }

        function processSpeechInput(rawText) {
            const { card, position, partialCardAttempt } = extractElements(rawText);

            // CASE 1: Both Card and Position spoken together
            if (card && position) {
                clearTimeout(pendingCardTimer);
                pendingCard = null;
                executeCalculation(card, position);
                return;
            }

            // CASE 2: Only Card spoken (e.g. "King of Clubs") — Lock card & wait for position number!
            if (card && !position) {
                pendingCard = card;
                const formatted = card.replace(/\b\w/g, c => c.toUpperCase());
                debugEl.innerText = `Locked: ${formatted} — Say position number...`;
                
                clearTimeout(pendingCardTimer);
                pendingCardTimer = setTimeout(() => {
                    if (pendingCard) {
                        pendingCard = null;
                        debugEl.innerText = `Timed out waiting for position.`;
                        speakResult("Repeat.");
                    }
                }, 10000); // Wait up to 10 seconds for the position number

                resetToListening();
                return;
            }

            // CASE 3: Position spoken right after a Card was locked in memory!
            if (!card && position && pendingCard) {
                const lockedCard = pendingCard;
                pendingCard = null;
                clearTimeout(pendingCardTimer);
                executeCalculation(lockedCard, position);
                return;
            }

            // CASE 4: Tried to say a card (e.g. "Spades 36") but missed the card value
            if (partialCardAttempt) {
                debugEl.innerText = `Missed card value: "${rawText}"`;
                speakResult("Repeat.");
                return;
            }

            // CASE 5: Normal conversation chatter — Ignore silently
            debugEl.innerText = pendingCard
                ? `Locked: ${pendingCard.toUpperCase()} — Waiting for number...`
                : `Ignored chatter: "${rawText}"`;
            resetToListening();
        }

        function executeCalculation(card, targetPosition) {
            const cardIndex = stack.indexOf(card);
            const currentPosition = cardIndex + 1; 
            const formattedHeardCard = card.replace(/\b\w/g, c => c.toUpperCase());

            let cutAmount = currentPosition - targetPosition;
            if (cutAmount < 0) cutAmount += 52;

            if (cutAmount === 0) {
                debugEl.innerText = `${formattedHeardCard} at ${targetPosition}`;
                resultEl.innerText = `Cut 0 (${formattedHeardCard})`;
                resultEl.style.display = 'block';
                speakResult(`${formattedHeardCard}, ${targetPosition}. Cut zero.`);
                return;
            }

            const bottomCardIndex = (cutAmount - 1 + 52) % 52;
            const bottomCard = stack[bottomCardIndex];
            const formattedBottom = bottomCard.replace(/\b\w/g, c => c.toUpperCase());
            
            const outputText = `${formattedHeardCard}, ${targetPosition}. Cut ${cutAmount}, ${formattedBottom}.`;

            debugEl.innerText = `${formattedHeardCard} at ${targetPosition}`;
            resultEl.innerText = `Cut ${cutAmount} (${formattedBottom})`;
            resultEl.style.display = 'block';

            speakResult(outputText);
        }

        async function speakResult(text) {
            isSpeaking = true;
            statusEl.innerText = "Speaking...";
            statusEl.style.color = "#9d84ff"; 

            speechFailSafeTimeout = setTimeout(() => {
                resetToListening();
            }, 7000);

            try {
                const res = await fetch('/api/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'tts', text: text })
                });
                const data = await res.json();

                if (data.audio && audioContext) {
                    if (audioContext.state !== 'running') {
                        await audioContext.resume().catch(() => {});
                    }

                    const binaryString = window.atob(data.audio);
                    const len = binaryString.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }

                    audioContext.decodeAudioData(
                        bytes.buffer,
                        (decodedBuffer) => {
                            const bufferSource = audioContext.createBufferSource();
                            bufferSource.buffer = decodedBuffer;
                            bufferSource.connect(audioContext.destination);
                            bufferSource.onended = () => {
                                setTimeout(resetToListening, 350);
                            };
                            bufferSource.start(0);
                        },
                        () => {
                            resetToListening();
                        }
                    );
                } else {
                    resetToListening();
                }
            } catch (e) {
                resetToListening();
            }
        }
    </script>
</body>
</html>
