<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ACAAN</title>
    <style>
        body {
            background-color: #0f111a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }
        h1 { color: #9d84ff; font-size: 2rem; margin-bottom: 10px; }
        #status { font-size: 1.2rem; margin-top: 20px; color: #a0a5b5; }
        #debug { font-size: 0.9rem; margin-top: 10px; color: #555; font-style: italic; min-height: 20px; }
        #result { font-size: 1.5rem; margin-top: 30px; font-weight: bold; color: #ffffff; padding: 20px; border-radius: 10px; background: #232533; display: none; width: 80%; }
    </style>
</head>
<body>

    <h1>ACAAN</h1>
    <div id="status">Starting mic...</div>
    <div id="debug"></div>
    <div id="result"></div>

    <script>
        const stack = [
            "4 of clubs", "2 of hearts", "7 of diamonds", "3 of clubs", "4 of hearts", "6 of diamonds", "ace of spades", "5 of hearts", "9 of spades", "2 of spades",
            "queen of hearts", "3 of diamonds", "queen of clubs", "8 of hearts", "6 of spades", "5 of spades", "9 of hearts", "king of clubs", "2 of diamonds", "jack of hearts",
            "3 of spades", "8 of spades", "6 of hearts", "10 of clubs", "5 of diamonds", "king of diamonds", "2 of clubs", "3 of hearts", "8 of diamonds", "5 of clubs",
            "king of spades", "jack of diamonds", "8 of clubs", "10 of spades", "king of hearts", "jack of clubs", "7 of spades", "10 of hearts", "ace of diamonds", "4 of spades",
            "7 of hearts", "4 of diamonds", "ace of clubs", "9 of clubs", "jack of spades", "queen of diamonds", "7 of clubs", "queen of spades", "10 of diamonds", "6 of clubs",
            "ace of hearts", "9 of diamonds"
        ];

        const statusEl = document.getElementById('status');
        const debugEl = document.getElementById('debug');
        const resultEl = document.getElementById('result');

        let recognition;
        let isListening = false;
        let voiceUnlocked = false;
        
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isListening = true;
                statusEl.innerText = "Listening...";
            };

            recognition.onresult = (event) => {
                let transcript = event.results[event.results.length - 1][0].transcript.toLowerCase();
                transcript = transcript.replace(/[.,!?]/g, "").trim();
                
                debugEl.innerText = `Heard: "${transcript}"`;
                
                processInput(transcript);
            };

            recognition.onerror = (event) => {
                if(event.error !== 'no-speech') {
                    statusEl.innerText = "Error, restarting mic...";
                }
            };

            recognition.onend = () => {
                isListening = false;
                setTimeout(() => {
                    try { recognition.start(); } catch(e) {}
                }, 400);
            };
        } else {
            statusEl.innerText = "Speech recognition not supported in this browser.";
        }

        // Hidden unlocker: Tap anywhere on the app to ensure the voice works
        document.body.addEventListener('touchstart', () => {
            if (!voiceUnlocked) {
                const unlockUtterance = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(unlockUtterance);
                voiceUnlocked = true;
            }
        });

        // Start listening immediately when the page loads
        window.addEventListener('load', () => {
            if (recognition && !isListening) {
                try { recognition.start(); } catch(e) {}
            }
        });

        function processInput(text) {
            // Convert written numbers to digits so they match the stack array
            text = text.replace(/\bone\b/g, "1")
                       .replace(/\btwo\b/g, "2")
                       .replace(/\bthree\b/g, "3")
                       .replace(/\bfour\b/g, "4")
                       .replace(/\bfive\b/g, "5")
                       .replace(/\bsix\b/g, "6")
                       .replace(/\bseven\b/g, "7")
                       .replace(/\beight\b/g, "8")
                       .replace(/\bnine\b/g, "9")
                       .replace(/\bten\b/g, "10");

            let foundCard = null;
            let cardIndex = -1;

            // Find which card was spoken
            for (let i = 0; i < stack.length; i++) {
                if (text.includes(stack[i])) {
                    foundCard = stack[i];
                    cardIndex = i;
                    break;
                }
            }

            // Find the spoken position (1-52)
            const numberMatch = text.match(/\b([1-9]|[1-4][0-9]|5[0-2])\b/);
            
            if (foundCard && numberMatch) {
                const targetPosition = parseInt(numberMatch[1], 10);
                const currentPosition = cardIndex + 1; 

                let cutAmount = currentPosition - targetPosition;
                if (cutAmount < 0) {
                    cutAmount += 52;
                }

                if (cutAmount === 0) {
                    return; 
                }

                // Identify the card that will be at the bottom after the cut
                const bottomCardIndex = (cutAmount - 1 + 52) % 52;
                const bottomCard = stack[bottomCardIndex];

                const formattedCard = bottomCard.replace(/\b\w/g, c => c.toUpperCase());
                const outputText = `Cut ${cutAmount} cards (${formattedCard}).`;

                resultEl.innerText = outputText;
                resultEl.style.display = 'block';

                speak(outputText);
            }
        }

        function speak(text) {
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
