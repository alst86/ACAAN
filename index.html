<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACAAN</title>
    <style>
        body {
            background-color: #0f111a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        h1 { color: #9d84ff; font-size: 2rem; margin-bottom: 10px; }
        #status { font-size: 1.2rem; margin-top: 20px; color: #a0a5b5; }
        #debug { font-size: 0.9rem; margin-top: 10px; color: #555; font-style: italic; min-height: 20px; padding: 0 20px; }
        #result { font-size: 1.5rem; margin-top: 30px; font-weight: bold; color: #ffffff; padding: 20px; border-radius: 10px; background: #232533; display: none; width: 80%; }
        #audio-unlock-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 17, 26, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            cursor: pointer;
        }
        #audio-unlock-overlay p {
            color: #9d84ff;
            font-size: 1.3rem;
            margin: 10px 20px;
        }
    </style>
</head>
<body>

    <div id="audio-unlock-overlay">
        <p>Tap to Connect Audio & Mic</p>
    </div>

    <h1>ACAAN</h1>
    <div id="status">Connecting...</div>
    <div id="debug"></div>
    <div id="result"></div>

    <!-- Hidden audio element for Bluetooth media routing -->
    <audio id="mediaAudio" playsinline preload="auto"></audio>

    <script>
        const stack = [
            "4 of clubs", "2 of hearts", "7 of diamonds", "3 of clubs", "4 of hearts", "6 of diamonds", "ace of spades", "5 of hearts", "9 of spades", "2 of spades",
            "queen of hearts", "3 of diamonds", "queen of clubs", "8 of hearts", "6 of spades", "5 of spades", "9 of hearts", "king of clubs", "2 of diamonds", "jack of hearts",
            "3 of spades", "8 of spades", "6 of hearts", "10 of clubs", "5 of diamonds", "king of diamonds", "2 of clubs", "3 of hearts", "8 of diamonds", "5 of clubs",
            "king of spades", "jack of diamonds", "8 of clubs", "10 of spades", "king of hearts", "jack of clubs", "7 of spades", "10 of hearts", "ace of diamonds", "4 of spades",
            "7 of hearts", "4 of diamonds", "ace of clubs", "9 of clubs", "jack of spades", "queen of diamonds", "7 of clubs", "queen of spades", "10 of diamonds", "6 of clubs",
            "ace of hearts", "9 of diamonds"
        ];

        const overlay = document.getElementById('audio-unlock-overlay');
        const statusEl = document.getElementById('status');
        const debugEl = document.getElementById('debug');
        const resultEl = document.getElementById('result');
        const mediaAudio = document.getElementById('mediaAudio');

        let recognition;
        let isListening = false;
        let isSpeaking = false;
        let isAppActive = true;
        let speechFailSafeTimeout = null;

        // Initialize Speech Recognition
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-SG';

            recognition.onstart = () => {
                isListening = true;
                if (isAppActive && !isSpeaking) statusEl.innerText = "Listening...";
            };

            recognition.onresult = (event) => {
                let transcript = event.results[event.results.length - 1][0].transcript.toLowerCase();
                transcript = transcript.replace(/[.,!?]/g, "").trim();
                debugEl.innerText = `Heard: "${transcript}"`;
                processInput(transcript);
            };

            recognition.onerror = (event) => {
                if (event.error !== 'no-speech' && !isSpeaking && isAppActive) {
                    statusEl.innerText = "Reconnecting mic...";
                }
            };

            recognition.onend = () => {
                isListening = false;
                if (!isSpeaking && isAppActive) {
                    setTimeout(() => {
                        try { recognition.start(); } catch(e) {}
                    }, 300);
                }
            };
        } else {
            statusEl.innerText = "Speech recognition not supported.";
        }

        // Tap once to unlock both Web Audio (for Bluetooth) and request microphone
        overlay.addEventListener('click', async () => {
            overlay.style.display = 'none';

            // 1. Prime the media audio player with a silent sample to unlock Bluetooth routing
            mediaAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
            try {
                await mediaAudio.play();
            } catch (e) {}

            // 2. Prime speech synthesis as secondary backup
            if ('speechSynthesis' in window) {
                window.speechSynthesis.resume();
                const unlock = new SpeechSynthesisUtterance(' ');
                unlock.volume = 0.01;
                window.speechSynthesis.speak(unlock);
            }

            // 3. Start recognition
            if (recognition) {
                try {
                    recognition.start();
                } catch(e) {}
            }
        });

        // App backgrounding logic
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                isAppActive = false;
                if (recognition) recognition.abort();
            } else {
                isAppActive = true;
                if (recognition && !isListening && !isSpeaking) {
                    setTimeout(() => {
                        try { recognition.start(); } catch(e) {}
                    }, 400);
                }
            }
        });

        function getEditDistance(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            const matrix = Array.from({ length: a.length + 1 }, (_, i) => [i]);
            for (let j = 0; j <= b.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    if (a[i - 1] === b[j - 1]) matrix[i][j] = matrix[i - 1][j - 1];
                    else matrix[i][j] = Math.min(matrix[i - 1][j - 1], matrix[i][j - 1], matrix[i - 1][j]) + 1;
                }
            }
            return matrix[a.length][b.length];
        }

        function findBestCardMatch(text) {
            let bestMatch = null;
            let bestScore = Infinity;
            let bestIndex = -1;
            const words = text.split(" ");
            
            for (let i = 0; i < stack.length; i++) {
                const card = stack[i];
                const cardWordCount = card.split(" ").length;
                
                if (words.length <= cardWordCount) {
                    const distance = getEditDistance(text, card);
                    if (distance < bestScore) {
                        bestScore = distance;
                        bestMatch = card;
                        bestIndex = i;
                    }
                    continue;
                }

                for (let j = 0; j <= words.length - cardWordCount; j++) {
                    const snippet = words.slice(j, j + cardWordCount).join(" ");
                    const distance = getEditDistance(snippet, card);
                    if (distance < bestScore) {
                        bestScore = distance;
                        bestMatch = card;
                        bestIndex = i;
                    }
                }
            }

            return bestScore <= 5 ? { card: bestMatch, index: bestIndex } : null;
        }

        function processInput(text) {
            if (isSpeaking) return;

            let processedText = text.replace(/\bone\b/g, "1").replace(/\btwo\b/g, "2").replace(/\bthree\b/g, "3")
                       .replace(/\bfour\b/g, "4").replace(/\bfive\b/g, "5").replace(/\bsix\b/g, "6")
                       .replace(/\bseven\b/g, "7").replace(/\beight\b/g, "8").replace(/\bnine\b/g, "9")
                       .replace(/\bten\b/g, "10");

            const numbers = processedText.match(/\b([1-9]|[1-4][0-9]|5[0-2])\b/g);
            
            if (numbers && numbers.length > 0) {
                const targetPositionStr = numbers[numbers.length - 1];
                const targetPosition = parseInt(targetPositionStr, 10);
                
                const lastIndex = processedText.lastIndexOf(targetPositionStr);
                let textWithoutPosition = processedText;
                if (lastIndex !== -1) {
                    textWithoutPosition = processedText.substring(0, lastIndex) + processedText.substring(lastIndex + targetPositionStr.length);
                }

                const matchResult = findBestCardMatch(textWithoutPosition.trim());
                
                if (matchResult) {
                    const currentPosition = matchResult.index + 1; 

                    let cutAmount = currentPosition - targetPosition;
                    if (cutAmount < 0) cutAmount += 52;
                    if (cutAmount === 0) return; 

                    const bottomCardIndex = (cutAmount - 1 + 52) % 52;
                    const bottomCard = stack[bottomCardIndex];
                    const formattedCard = bottomCard.replace(/\b\w/g, c => c.toUpperCase());
                    const outputText = `Cut ${cutAmount} cards (${formattedCard}).`;

                    resultEl.innerText = outputText;
                    resultEl.style.display = 'block';

                    speakViaMedia(outputText);
                }
            }
        }

        function finishSpeakingAndRestartMic() {
            if (!isSpeaking) return;
            isSpeaking = false;
            clearTimeout(speechFailSafeTimeout);
            
            if (isAppActive) {
                statusEl.innerText = "Listening...";
                setTimeout(() => {
                    try { recognition.start(); } catch(e) {}
                }, 300);
            }
        }

        // Plays audio over standard iOS Media Channel (Bluetooth / Earpiece compatible)
        function speakViaMedia(text) {
            isSpeaking = true;
            statusEl.innerText = "Speaking...";
            
            // 1. Release microphone focus
            if (recognition) {
                recognition.abort();
            }

            // 2. Encode text for speech stream
            const cleanText = text.replace(/[()]/g, '');
            const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(cleanText)}&tl=en&client=tw-ob`;

            mediaAudio.src = audioUrl;

            mediaAudio.onended = () => {
                finishSpeakingAndRestartMic();
            };

            mediaAudio.onerror = () => {
                // If network audio fails, fall back to native speech
                if ('speechSynthesis' in window) {
                    const fallback = new SpeechSynthesisUtterance(text);
                    fallback.rate = 1.0;
                    fallback.onend = finishSpeakingAndRestartMic;
                    fallback.onerror = finishSpeakingAndRestartMic;
                    window.speechSynthesis.speak(fallback);
                } else {
                    finishSpeakingAndRestartMic();
                }
            };

            setTimeout(() => {
                mediaAudio.play().catch(() => {
                    finishSpeakingAndRestartMic();
                });
            }, 300);

            // Fail-safe to prevent lockup
            speechFailSafeTimeout = setTimeout(() => {
                finishSpeakingAndRestartMic();
            }, 5000);
        }
    </script>
</body>
</html>
