<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACAAN</title>
    <style>
        body {
            background-color: #0f111a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        h1 { color: #9d84ff; font-size: 2rem; margin-bottom: 10px; }
        #status { font-size: 1.3rem; font-weight: 600; margin-top: 20px; color: #50fa7b; transition: color 0.1s; }
        #debug { font-size: 0.9rem; margin-top: 10px; color: #777; font-style: italic; min-height: 24px; padding: 0 20px; }
        #result { font-size: 1.4rem; margin-top: 30px; font-weight: bold; color: #ffffff; padding: 20px; border-radius: 10px; background: #232533; display: none; width: 80%; }
        #app-content { display: flex; flex-direction: column; align-items: center; width: 100%; }
        #haptic-wrap { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; overflow: hidden; }
    </style>
</head>
<body>

    <div id="haptic-wrap">
        <input type="checkbox" id="haptic-switch" switch>
        <label for="haptic-switch" id="haptic-label"></label>
    </div>

    <div id="app-content">
        <h1>ACAAN</h1>
        <div id="status">Initializing...</div>
        <div id="debug">Tap screen once to arm earpiece</div>
        <div id="result"></div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const debugEl = document.getElementById('debug');
        const resultEl = document.getElementById('result');
        const hapticLabel = document.getElementById('haptic-label');

        let isSpeaking = false;
        let isAnalyzing = false;
        let isRecording = false;
        let hasAnnouncedReady = false;
        let speechFailSafeTimeout = null;
        let keepWarmInterval = null;
        let micCooldownUntil = 0;
        let lastTouchTime = 0;
        
        let audioContext = null;
        let audioStream = null;
        let processorNode = null;
        let silenceTimer = null;
        let maxRecordTimer = null;

        // 0.75s Pre-Roll so the first word is never clipped
        let preRollChunks = [];
        let recordedChunks = [];
        const PRE_ROLL_MAX_CHUNKS = 8; 
        let consecutiveLoudChunks = 0;
        let activeSpeechChunksCount = 0;

        // Two-way memory + rolling transcript memory
        let pendingCard = null;
        let pendingPosition = null;
        let previousTranscript = "";
        let pendingTimer = null;

        const alertBuffers = {
            ready: null,
            repeat: null,
            number: null,
            card: null
        };

        function triggerHaptic(pattern = [60]) {
            try {
                if (navigator.vibrate) navigator.vibrate(pattern);
                if (hapticLabel) hapticLabel.click();
            } catch (e) {}
        }

        // Single tap anywhere wakes audio or whispers current readiness state in pocket
        function handleScreenTap() {
            const now = Date.now();
            if (now - lastTouchTime < 400) return; // Prevent double firing from touchstart + click
            lastTouchTime = now;

            triggerHaptic([40]);
            if (!audioContext) return;

            if (audioContext.state !== 'running') {
                audioContext.resume().then(() => {
                    announceReadyState(true);
                }).catch(() => {});
            } else {
                announceReadyState(true);
            }
        }
        document.body.addEventListener('touchstart', handleScreenTap, { passive: true });
        document.body.addEventListener('click', handleScreenTap);

        async function decodeBase64ToBuffer(base64) {
            if (!base64 || !audioContext) return null;
            try {
                const binaryString = window.atob(base64);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                return await new Promise((resolve) => {
                    audioContext.decodeAudioData(bytes.buffer, resolve, () => resolve(null));
                });
            } catch (e) {
                return null;
            }
        }

        async function preloadAlerts() {
            try {
                const res = await fetch('/api/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'init_alerts' })
                });
                const data = await res.json();
                const [readyBuf, repeatBuf, numberBuf, cardBuf] = await Promise.all([
                    decodeBase64ToBuffer(data.ready),
                    decodeBase64ToBuffer(data.repeat),
                    decodeBase64ToBuffer(data.number),
                    decodeBase64ToBuffer(data.card)
                ]);
                alertBuffers.ready = readyBuf;
                alertBuffers.repeat = repeatBuf;
                alertBuffers.number = numberBuf;
                alertBuffers.card = cardBuf;

                if (!hasAnnouncedReady && audioContext && audioContext.state === 'running') {
                    announceReadyState(false);
                }
            } catch (e) {}
        }

        function announceReadyState(isManualTap = false) {
            if (!audioContext || audioContext.state !== 'running') return;
            if (isSpeaking || isAnalyzing) return;

            if (!isManualTap && hasAnnouncedReady) return;

            if (pendingCard && !pendingPosition) {
                playAlert('number');
                return;
            }
            if (pendingPosition && !pendingCard) {
                playAlert('card');
                return;
            }

            if (alertBuffers.ready) {
                hasAnnouncedReady = true;
                triggerHaptic([70, 50, 70]);
                debugEl.innerText = "Ready — Speak card and position";
                playDecodedBuffer(alertBuffers.ready);
            }
        }

        async function startListening() {
            if (audioStream) return; 

            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const sourceNode = audioContext.createMediaStreamSource(audioStream);

                processorNode = audioContext.createScriptProcessor(2048, 1, 1);
                const silentGain = audioContext.createGain();
                silentGain.gain.value = 0;

                sourceNode.connect(processorNode);
                processorNode.connect(silentGain);
                silentGain.connect(audioContext.destination);

                processorNode.onaudioprocess = (e) => {
                    // Ignore mic while speaking, analyzing, or during post-speech echo cooldown
                    if (isSpeaking || isAnalyzing || Date.now() < micCooldownUntil) return;

                    const inputData = e.inputBuffer.getChannelData(0);
                    const chunkCopy = new Float32Array(inputData);

                    let maxPeak = 0;
                    for (let i = 0; i < chunkCopy.length; i++) {
                        const abs = Math.abs(chunkCopy[i]);
                        if (abs > maxPeak) maxPeak = abs;
                    }
                    const displayLevel = Math.min(99, Math.round(maxPeak * 140));
                    
                    // Threshold 15 ignores quiet room hum & breathing
                    const SPEECH_THRESHOLD = 15;

                    if (!isRecording) {
                        preRollChunks.push(chunkCopy);
                        if (preRollChunks.length > PRE_ROLL_MAX_CHUNKS) {
                            preRollChunks.shift();
                        }
                        statusEl.innerText = `🟢 Ready & Listening (${displayLevel})`;
                        statusEl.style.color = "#50fa7b";

                        if (displayLevel > SPEECH_THRESHOLD) {
                            consecutiveLoudChunks++;
                            // Require 2 consecutive voice chunks (~90ms) so random clicks don't trigger recording
                            if (consecutiveLoudChunks >= 2) {
                                isRecording = true;
                                activeSpeechChunksCount = consecutiveLoudChunks;
                                recordedChunks = [...preRollChunks, chunkCopy];
                                preRollChunks = [];
                                statusEl.innerText = "🔴 Recording...";
                                statusEl.style.color = "#ff5555";

                                if (pendingTimer) clearTimeout(pendingTimer);

                                maxRecordTimer = setTimeout(() => {
                                    if (isRecording) finishRecordingAndTranscribe();
                                }, 5000);

                                clearTimeout(silenceTimer);
                                silenceTimer = setTimeout(() => {
                                    if (isRecording) finishRecordingAndTranscribe();
                                }, 1150);
                            }
                        } else {
                            consecutiveLoudChunks = 0;
                        }
                    } else {
                        recordedChunks.push(chunkCopy);
                        if (displayLevel > SPEECH_THRESHOLD) {
                            activeSpeechChunksCount++;
                            clearTimeout(silenceTimer);
                            silenceTimer = setTimeout(() => {
                                if (isRecording) finishRecordingAndTranscribe();
                            }, 1150);
                        }
                    }
                };

                resetToListening();
                preloadAlerts();

                clearInterval(keepWarmInterval);
                keepWarmInterval = setInterval(() => {
                    if (!isAnalyzing && !isRecording) {
                        fetch('/api/transcribe', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'ping' })
                        }).catch(() => {});
                    }
                }, 25000);

            } catch (err) {
                statusEl.innerText = "Mic Permission Denied";
            }
        }

        function encodeWAV(chunks, inputSampleRate) {
            let totalLength = 0;
            for (const c of chunks) totalLength += c.length;
            const merged = new Float32Array(totalLength);
            let offset = 0;
            for (const c of chunks) {
                merged.set(c, offset);
                offset += c.length;
            }

            const targetRate = 16000;
            const ratio = inputSampleRate / targetRate;
            const newLength = Math.round(merged.length / ratio);
            const buffer = new ArrayBuffer(44 + newLength * 2);
            const view = new DataView(buffer);

            const writeString = (off, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i));
            };

            writeString(0, 'RIFF');
            view.setUint32(4, 36 + newLength * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, targetRate, true);
            view.setUint32(28, targetRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, newLength * 2, true);

            let outOffset = 44;
            for (let i = 0; i < newLength; i++) {
                const start = Math.floor(i * ratio);
                const end = Math.min(merged.length, Math.ceil((i + 1) * ratio));
                let sum = 0;
                let count = 0;
                for (let j = start; j < end; j++) {
                    sum += merged[j];
                    count++;
                }
                const sample = count > 0 ? sum / count : merged[Math.min(merged.length - 1, start)];
                const s = Math.max(-1, Math.min(1, sample));
                view.setInt16(outOffset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                outOffset += 2;
            }

            const bytes = new Uint8Array(buffer);
            let binary = '';
            const chunkSize = 8192;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return window.btoa(binary);
        }

        async function finishRecordingAndTranscribe() {
            clearTimeout(silenceTimer);
            clearTimeout(maxRecordTimer);
            isRecording = false;
            consecutiveLoudChunks = 0;

            const chunksToProcess = recordedChunks;
            const speechFrames = activeSpeechChunksCount;
            recordedChunks = [];
            activeSpeechChunksCount = 0;

            // If it was just a brief cough or bump (< 4 loud frames), ignore silently without calling server
            if (chunksToProcess.length === 0 || speechFrames < 4) {
                resetToListening();
                return;
            }

            isAnalyzing = true;
            statusEl.innerText = "Analyzing...";
            statusEl.style.color = "#ffb86c";

            try {
                const sampleRate = audioContext ? audioContext.sampleRate : 44100;
                const base64Wav = encodeWAV(chunksToProcess, sampleRate);

                const res = await fetch('/api/transcribe', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        audio: base64Wav,
                        pendingCard: pendingCard,
                        pendingPosition: pendingPosition,
                        previousTranscript: previousTranscript
                    })
                });
                const data = await res.json();
                isAnalyzing = false;

                if (data.error) {
                    debugEl.innerText = `Error: ${data.error}`;
                    resetToListening();
                    return;
                }

                if (data.resolved) {
                    clearTimeout(pendingTimer);
                    pendingCard = null;
                    pendingPosition = null;
                    previousTranscript = "";

                    debugEl.innerText = data.debugText;
                    resultEl.innerText = data.resultText;
                    resultEl.style.display = 'block';
                    triggerHaptic([80, 40, 80]);

                    if (data.audio) {
                        // Speak the cut result, then whisper "Ready." when back in listening mode
                        playBase64Audio(data.audio, true);
                    } else {
                        resetToListening();
                    }
                    return;
                }

                handleUnresolvedSpeech(data);
            } catch (e) {
                isAnalyzing = false;
                debugEl.innerText = "Connection error.";
                resetToListening();
            }
        }

        function startPendingTimeout() {
            clearTimeout(pendingTimer);
            pendingTimer = setTimeout(() => {
                if (pendingCard || pendingPosition) {
                    pendingCard = null;
                    pendingPosition = null;
                    previousTranscript = "";
                    debugEl.innerText = "Reset — Ready for card & position";
                    playAlert('ready');
                }
            }, 15000);
        }

        function playAlert(type) {
            triggerHaptic([50]);
            const buffer = alertBuffers[type];
            if (buffer) {
                playDecodedBuffer(buffer);
            } else {
                const fallbackMap = { repeat: "Repeat.", number: "Number.", card: "Card.", ready: "Ready." };
                speakFallback(fallbackMap[type] || "Ready.");
            }
        }

        function handleUnresolvedSpeech(data) {
            const rawText = (data.text || "").trim();

            if (rawText.length > 1) {
                previousTranscript = rawText;
            }

            // Card heard first -> Whisper "Number."
            if (data.card && !data.position) {
                pendingCard = data.card;
                const formatted = data.card.replace(/\b\w/g, c => c.toUpperCase());
                debugEl.innerText = `Locked: ${formatted} — Say position...`;
                startPendingTimeout();
                playAlert('number');
                return;
            }

            // Number heard first -> Whisper "Card."
            if (!data.card && data.position) {
                pendingPosition = data.position;
                debugEl.innerText = `Locked Position: ${data.position} — Say card...`;
                startPendingTimeout();
                playAlert('card');
                return;
            }

            // Partial card heard -> Whisper "Repeat."
            if (data.partialCardAttempt) {
                debugEl.innerText = `Missed card value: "${rawText}"`;
                playAlert('repeat');
                return;
            }

            // Normal patter / background chatter -> Stay 100% silent
            if (pendingCard) {
                debugEl.innerText = `Locked: ${pendingCard.toUpperCase()} — Waiting for number...`;
            } else if (pendingPosition) {
                debugEl.innerText = `Locked Position: ${pendingPosition} — Waiting for card...`;
            } else {
                debugEl.innerText = "Ready — Speak card and position";
            }
            resetToListening();
        }

        function playDecodedBuffer(decodedBuffer, announceReadyAfter = false) {
            if (!audioContext || !decodedBuffer) {
                resetToListening();
                return;
            }
            isSpeaking = true;
            statusEl.innerText = "🔊 Speaking...";
            statusEl.style.color = "#9d84ff";

            speechFailSafeTimeout = setTimeout(() => {
                resetToListening();
            }, 6500);

            try {
                const bufferSource = audioContext.createBufferSource();
                bufferSource.buffer = decodedBuffer;
                bufferSource.connect(audioContext.destination);
                bufferSource.onended = () => {
                    if (announceReadyAfter && alertBuffers.ready) {
                        // Brief 600ms pause after reading the cut, then whisper "Ready."
                        setTimeout(() => {
                            if (alertBuffers.ready) {
                                debugEl.innerText = "Ready — Speak card and position";
                                playDecodedBuffer(alertBuffers.ready, false);
                            } else {
                                resetToListening();
                            }
                        }, 600);
                    } else {
                        resetToListening();
                    }
                };
                bufferSource.start(0);
            } catch (e) {
                resetToListening();
            }
        }

        async function playBase64Audio(base64Audio, announceReadyAfter = false) {
            isSpeaking = true;
            statusEl.innerText = "🔊 Speaking...";
            statusEl.style.color = "#9d84ff";

            speechFailSafeTimeout = setTimeout(() => {
                resetToListening();
            }, 7500);

            try {
                if (audioContext && audioContext.state !== 'running') {
                    await audioContext.resume().catch(() => {});
                }
                const decodedBuffer = await decodeBase64ToBuffer(base64Audio);
                if (decodedBuffer) {
                    playDecodedBuffer(decodedBuffer, announceReadyAfter);
                } else {
                    resetToListening();
                }
            } catch (e) {
                resetToListening();
            }
        }

        async function speakFallback(text) {
            try {
                const res = await fetch('/api/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'tts', text: text })
                });
                const data = await res.json();
                if (data.audio) playBase64Audio(data.audio, false);
                else resetToListening();
            } catch (e) {
                resetToListening();
            }
        }

        function resetToListening() {
            isSpeaking = false;
            isAnalyzing = false;
            consecutiveLoudChunks = 0;
            preRollChunks = [];
            // 500ms cooldown after speaking so the mic never records its own earpiece echo
            micCooldownUntil = Date.now() + 500;
            clearTimeout(speechFailSafeTimeout);
            if (audioContext && audioContext.state !== 'running') {
                audioContext.resume().catch(() => {});
            }
            statusEl.innerText = "🟢 Ready & Listening";
            statusEl.style.color = "#50fa7b";
        }

        function stopListening() {
            clearTimeout(silenceTimer);
            clearTimeout(maxRecordTimer);
            clearTimeout(speechFailSafeTimeout);
            clearTimeout(pendingTimer);
            clearInterval(keepWarmInterval);
            if (processorNode) {
                try { processorNode.disconnect(); } catch (e) {}
                processorNode = null;
            }
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
                audioStream = null;
            }
            if (audioContext) {
                audioContext.close().catch(() => {});
                audioContext = null;
            }
            isRecording = false;
            isSpeaking = false;
            isAnalyzing = false;
            hasAnnouncedReady = false;
            statusEl.innerText = "Paused";
        }

        window.addEventListener('load', startListening);

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopListening();
            } else {
                startListening();
            }
        });
    </script>
</body>
</html>
