<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACAAN</title>
    <style>
        body {
            background-color: #0f111a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        h1 { color: #9d84ff; font-size: 2rem; margin-bottom: 10px; }
        #status { font-size: 1.2rem; margin-top: 20px; color: #a0a5b5; transition: color 0.3s; }
        #debug { font-size: 0.9rem; margin-top: 10px; color: #777; font-style: italic; min-height: 24px; padding: 0 20px; }
        #result { font-size: 1.4rem; margin-top: 30px; font-weight: bold; color: #ffffff; padding: 20px; border-radius: 10px; background: #232533; display: none; width: 80%; }
        #app-content { display: flex; flex-direction: column; align-items: center; width: 100%; }
    </style>
</head>
<body>

    <div id="app-content">
        <h1>ACAAN</h1>
        <div id="status">Initializing...</div>
        <div id="debug">Tap anywhere once to prime earpiece</div>
        <div id="result"></div>
    </div>

    <audio id="audioPlayer" playsinline></audio>

    <script>
        const stack = [
            "4 of clubs", "2 of hearts", "7 of diamonds", "3 of clubs", "4 of hearts", "6 of diamonds", "ace of spades", "5 of hearts", "9 of spades", "2 of spades",
            "queen of hearts", "3 of diamonds", "queen of clubs", "8 of hearts", "6 of spades", "5 of spades", "9 of hearts", "king of clubs", "2 of diamonds", "jack of hearts",
            "3 of spades", "8 of spades", "6 of hearts", "10 of clubs", "5 of diamonds", "king of diamonds", "2 of clubs", "3 of hearts", "8 of diamonds", "5 of clubs",
            "king of spades", "jack of diamonds", "8 of clubs", "10 of spades", "king of hearts", "jack of clubs", "7 of spades", "10 of hearts", "ace of diamonds", "4 of spades",
            "7 of hearts", "4 of diamonds", "ace of clubs", "9 of clubs", "jack of spades", "queen of diamonds", "7 of clubs", "queen of spades", "10 of diamonds", "6 of clubs",
            "ace of hearts", "9 of diamonds"
        ];

        const statusEl = document.getElementById('status');
        const debugEl = document.getElementById('debug');
        const resultEl = document.getElementById('result');
        const audioPlayer = document.getElementById('audioPlayer');

        let isSpeaking = false;
        let audioUnlocked = false;
        let speechFailSafeTimeout = null;
        
        let audioContext = null;
        let mediaRecorder = null;
        let audioStream = null;
        let audioChunks = [];
        let isRecording = false;
        let silenceTimer = null;
        let analyser = null;
        let dataArray = null;
        let animationFrameId = null;

        document.body.addEventListener('touchstart', () => {
            if (!audioUnlocked) {
                audioPlayer.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
                audioPlayer.play().catch(() => {});
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                audioUnlocked = true;
                debugEl.innerText = "Earpiece ready. Speak card and position.";
            }
        });

        async function startListening() {
            if (audioStream) return; 

            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(audioStream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                mediaRecorder = new MediaRecorder(audioStream);
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                
                mediaRecorder.onstop = async () => {
                    if (audioChunks.length === 0) return;
                    const audioBlob = new Blob(audioChunks, { type: 'audio/mp4' });
                    audioChunks = []; 
                    
                    statusEl.innerText = "Analyzing...";
                    statusEl.style.color = "#ffb86c"; 
                    
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = async () => {
                        const base64data = reader.result.split(',')[1];
                        
                        try {
                            const res = await fetch('/api/transcribe', { 
                                method: 'POST', 
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ audio: base64data })
                            });
                            const data = await res.json();
                            
                            if (data.error) {
                                debugEl.innerText = `Error: ${data.error}`;
                                resetToListening();
                                return;
                            }
                            
                            if (data.text) {
                                processSpeechInput(data.text);
                            } else {
                                resetToListening();
                            }
                        } catch (e) {
                            debugEl.innerText = "Connection error.";
                            resetToListening();
                        }
                    };
                };

                resetToListening();
                monitorAudioLevel();

            } catch (err) {
                statusEl.innerText = "Mic Permission Denied";
            }
        }

        function resetToListening() {
            isSpeaking = false;
            clearTimeout(speechFailSafeTimeout);
            if (audioStream) {
                audioStream.getAudioTracks().forEach(t => t.enabled = true);
            }
            statusEl.innerText = "Listening...";
            statusEl.style.color = "#a0a5b5";
        }

        function stopListening() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
                audioStream = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            clearTimeout(silenceTimer);
            clearTimeout(speechFailSafeTimeout);
            isRecording = false;
            isSpeaking = false;
            statusEl.innerText = "Paused";
        }

        window.addEventListener('load', startListening);

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopListening();
            } else {
                startListening();
            }
        });

        function monitorAudioLevel() {
            if (!analyser || !audioStream) return;
            if (isSpeaking) {
                animationFrameId = requestAnimationFrame(monitorAudioLevel);
                return;
            }

            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for(let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            let average = sum / dataArray.length;

            // Lowered from 15 to 10 so the first word ("10 of...") is never clipped
            const SPEECH_THRESHOLD = 10; 

            if (average > SPEECH_THRESHOLD) {
                if (!isRecording && mediaRecorder && mediaRecorder.state === 'inactive') {
                    isRecording = true;
                    mediaRecorder.start();
                    statusEl.innerText = "Recording...";
                    statusEl.style.color = "#ff5555"; 
                }
                
                clearTimeout(silenceTimer);
                
                // 1.6s pause window allows natural breathing between naming card and position
                silenceTimer = setTimeout(() => {
                    if (isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') {
                        isRecording = false;
                        mediaRecorder.stop(); 
                    }
                }, 1600); 
            }
            
            animationFrameId = requestAnimationFrame(monitorAudioLevel);
        }

        // --- STRICT CARD, SUIT & POSITION VALIDATION ---
        function parseCardAndPosition(rawText) {
            const cleanRaw = rawText.trim();

            // Ignore pure silence or Whisper background noise hallucinations silently
            if (
                cleanRaw.length < 2 ||
                /^(you|thank you|thanks|bye|okay|oh|uh|um)$/i.test(cleanRaw) ||
                /thank you for|watching|joining|subtitles|amara\.org/i.test(cleanRaw)
            ) {
                return { valid: false, silentIgnore: true };
            }

            let text = cleanRaw.toLowerCase().replace(/[.,!?]/g, ' ').replace(/\s+/g, ' ').trim();

            const wordToNum = {
                'one': '1', 'two': '2', 'to': '2', 'too': '2', 'three': '3', 'tree': '3',
                'four': '4', 'for': '4', 'ford': '4', 'five': '5', 'six': '6', 'seven': '7',
                'eight': '8', 'ate': '8', 'nine': '9', 'ten': '10',
                'eleven': '11', 'twelve': '12', 'thirteen': '13', 'fourteen': '14', 'fifteen': '15',
                'sixteen': '16', 'seventeen': '17', 'eighteen': '18', 'nineteen': '19', 'twenty': '20',
                'thirty': '30', 'forty': '40', 'fifty': '50'
            };

            for (const [w, n] of Object.entries(wordToNum)) {
                text = text.replace(new RegExp(`\\b${w}\\b`, 'g'), n);
            }
            text = text.replace(/\b(20|30|40|50)\s+([1-9])\b/g, (m, tens, ones) => String(parseInt(tens) + parseInt(ones)));

            // 1. Identify Suit
            const suitMatch = text.match(/\b(clubs?|clovers?|flowers?|hearts?|spades?|diamonds?)\b/);
            if (!suitMatch) return { valid: false, silentIgnore: false };

            let suit = suitMatch[1];
            if (suit.startsWith('club') || suit.startsWith('clover') || suit.startsWith('flower')) suit = 'clubs';
            else if (suit.startsWith('heart')) suit = 'hearts';
            else if (suit.startsWith('spade')) suit = 'spades';
            else if (suit.startsWith('diamond')) suit = 'diamonds';

            // 2. Identify Card Value
            const valueMatch = text.match(/\b(ace|jack|queen|king|10|[2-9])\b/);
            if (!valueMatch) return { valid: false, silentIgnore: false };

            let value = valueMatch[1];
            const targetCard = `${value} of ${suit}`;

            const cardIndex = stack.indexOf(targetCard);
            if (cardIndex === -1) return { valid: false, silentIgnore: false };

            // 3. Identify Target Position (1 to 52)
            let remainingText = text.replace(valueMatch[0], ' ').replace(suitMatch[0], ' ');
            const numbersFound = remainingText.match(/\b([1-9]|[1-4][0-9]|5[0-2])\b/g);
            if (!numbersFound || numbersFound.length === 0) return { valid: false, silentIgnore: false };

            const targetPosition = parseInt(numbersFound[numbersFound.length - 1], 10);

            return {
                valid: true,
                card: targetCard,
                cardIndex: cardIndex,
                position: targetPosition
            };
        }

        function processSpeechInput(rawText) {
            const parsed = parseCardAndPosition(rawText);

            if (!parsed.valid) {
                resultEl.style.display = 'none';
                debugEl.innerText = `Heard: "${rawText}" (Need card value, suit & number)`;
                
                // If real speech was detected but incomplete, notify via earpiece immediately
                if (!parsed.silentIgnore) {
                    speakResult("Missed, repeat.");
                } else {
                    resetToListening();
                }
                return;
            }

            const currentPosition = parsed.cardIndex + 1; 
            const targetPosition = parsed.position;
            const formattedHeardCard = parsed.card.replace(/\b\w/g, c => c.toUpperCase());

            let cutAmount = currentPosition - targetPosition;
            if (cutAmount < 0) cutAmount += 52;

            if (cutAmount === 0) {
                debugEl.innerText = `Heard: ${formattedHeardCard} at ${targetPosition}`;
                resultEl.innerText = `${formattedHeardCard} at ${targetPosition} — Cut 0.`;
                resultEl.style.display = 'block';
                speakResult(`${formattedHeardCard} at ${targetPosition}. Already there, cut zero.`);
                return;
            }

            const bottomCardIndex = (cutAmount - 1 + 52) % 52;
            const bottomCard = stack[bottomCardIndex];
            const formattedBottom = bottomCard.replace(/\b\w/g, c => c.toUpperCase());
            
            // Confirms the heard card + position first, then gives the cut instruction
            const outputText = `${formattedHeardCard} at ${targetPosition}. Cut ${cutAmount} cards, ${formattedBottom}.`;

            debugEl.innerText = `Heard: ${formattedHeardCard} at position ${targetPosition}`;
            resultEl.innerText = `Cut ${cutAmount} cards (${formattedBottom}).`;
            resultEl.style.display = 'block';

            speakResult(outputText);
        }

        async function speakResult(text) {
            isSpeaking = true;
            statusEl.innerText = "Speaking...";
            statusEl.style.color = "#9d84ff"; 

            if (audioStream) {
                audioStream.getAudioTracks().forEach(t => t.enabled = false);
            }

            speechFailSafeTimeout = setTimeout(() => {
                resetToListening();
            }, 8000);

            try {
                const res = await fetch('/api/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'tts', text: text })
                });
                const data = await res.json();

                if (data.audio) {
                    audioPlayer.src = `data:audio/mp3;base64,${data.audio}`;
                    audioPlayer.onended = () => resetToListening();
                    audioPlayer.onerror = () => resetToListening();
                    await audioPlayer.play();
                } else {
                    resetToListening();
                }
            } catch (e) {
                resetToListening();
            }
        }
    </script>
</body>
</html>
